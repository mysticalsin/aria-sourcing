# aria-mantu-computers — OpenBot Chromium supervisor for campaign Agents / Fleet.
# Fly-only production path. Do not point Vercel at this service.
app            = "aria-mantu-computers"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile.computers"

[env]
  NODE_ENV                 = "production"
  PORT                     = "8080"
  OPENBOT_SUPERVISOR_PORT  = "8080"
  OPENBOT_HEADED           = "0"
  OPENBOT_MAX_COMPUTERS    = "5"
  OPENBOT_PROFILE_ROOT     = "/data/profiles"
  OPENBOT_PUBLIC_BASE      = "https://aria-mantu-computers.fly.dev"
  # Secrets (fly secrets set -a aria-mantu-computers):
  #   SUPERVISOR_TOKEN, COMPUTER_TOKEN

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "off"
  auto_start_machines  = true
  min_machines_running = 1
  [http_service.concurrency]
    type       = "requests"
    soft_limit = 50
    hard_limit = 80
  [[http_service.checks]]
    method       = "GET"
    path         = "/health"
    interval     = "15s"
    timeout      = "5s"
    grace_period = "30s"

[[vm]]
  size   = "performance-2x"
  memory = "4gb"
