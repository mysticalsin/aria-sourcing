[workspace]
resolver = "2"
members = [
    "crates/aria-scoring",
    "crates/aria-dedupe",
    "crates/aria-ledger",
    "crates/aria-pipeline",
    "crates/aria-ffi",
    "crates/aria-bench",
]
exclude = ["go"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false
version = "0.1.0"

[workspace.dependencies]
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
criterion = "0.5"
aria-scoring = { path = "crates/aria-scoring" }
aria-dedupe = { path = "crates/aria-dedupe" }
aria-ledger = { path = "crates/aria-ledger" }
aria-pipeline = { path = "crates/aria-pipeline" }
