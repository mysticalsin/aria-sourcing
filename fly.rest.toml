# aria-mantu-rest — PostgREST (stock image). INTERNAL ONLY, reached at aria-mantu-rest.internal:3000.
app            = "aria-mantu-rest"
primary_region = "cdg"

[build]
  image = "postgrest/postgrest:v14.12@sha256:54000f24847d01a2c2302e0041cf0618b875c57fb48507d743cfa9aaa50bf43c"

[env]
  PGRST_SERVER_HOST          = "*6"     # bind IPv6 for the 6PN .internal net (default !4 = IPv4 only)
  PGRST_DB_SCHEMAS           = "public"
  PGRST_DB_ANON_ROLE         = "anon"
  PGRST_DB_USE_LEGACY_GUCS   = "false"
  PGRST_APP_SETTINGS_JWT_EXP = "3600"
  PGRST_ADMIN_SERVER_PORT    = "3001"
  # Secrets (fly secrets set): PGRST_JWT_SECRET (=FLY_JWT_SECRET),
  #   PGRST_APP_SETTINGS_JWT_SECRET (=FLY_JWT_SECRET),
  #   PGRST_DB_URI = postgres://authenticator:<FLY_REST_DB_PASSWORD>@aria-mantu-db.internal:5432/postgres

[[services]]
  internal_port = 3000
  protocol      = "tcp"
  auto_stop_machines   = "off"
  auto_start_machines  = false
  min_machines_running = 1
  # no external ports → internal only
  [[services.tcp_checks]]
    grace_period = "15s"
    interval     = "15s"
    timeout      = "3s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
