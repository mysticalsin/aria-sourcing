openapi: 3.1.0
info:
  title: ARIA internal sourcing API
  version: '2026-07-14'
  description: >-
    Additive-only browser-to-server contract for candidate-erasure operations. Breaking changes move to /api/v2 and retain the prior contract for
    at least three months.
servers:
  - url: /
security:
  - supabaseSession: []
paths:
  /api/admin/candidates/erasure:
    post:
      operationId: requestCandidateErasure
      summary: Scrub one exact candidate and track external provider obligations
      description: >-
        Canonical administrator-only candidate-rights operation. One database transaction binds the
        workspace, campaign, candidate, actor, and idempotency key; blocks on an active legal hold;
        scrubs local candidate data; and emits content-free per-store row counts. A 200 response
        means no external provider obligation remains. A 202 response is explicitly non-final and
        identifies provider work that is pending, manual, or retryable. Unsupported provider
        deletion is manual_required and is never represented as completed. If more than 100 provider
        records are linked, the transaction returns a typed 409 before any local data is changed so
        an administrator can route the request to the documented manual privacy process.
      x-aria-contract-version: '2026-07-14'
      x-aria-max-body-bytes: 1000
      x-aria-request-throttle:
        storage: per-instance-memory
        windowSeconds: 60
        maxRequests: 10
        keyDimensions:
          - route
          - trusted-proxy-address
          - authenticated-user
      parameters:
        - $ref: '#/components/parameters/SameOriginHeader'
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            format: uuid
          description: Replays the original exact-candidate receipt without a second scrub.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateErasureRequest'
      responses:
        '200':
          description: Local erasure completed and no provider obligation remains.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateErasureResponse'
        '202':
          description: >-
            Local data was scrubbed, but at least one provider obligation is pending_provider,
            manual_required, or retryable_failure. This is not a completed erasure.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateErasureResponse'
        '400':
          $ref: '#/components/responses/CandidateErasureErrorResponse'
        '401':
          $ref: '#/components/responses/CandidateErasureErrorResponse'
        '403':
          $ref: '#/components/responses/CandidateErasureErrorResponse'
        '404':
          $ref: '#/components/responses/CandidateErasureErrorResponse'
        '409':
          description: >-
            Idempotency conflict, or the candidate has more than 100 provider obligations. The
            latter returns candidate_erasure_obligation_limit_exceeded and changes no data.
          $ref: '#/components/responses/CandidateErasureErrorResponse'
        '413':
          $ref: '#/components/responses/CandidateErasureErrorResponse'
        '415':
          $ref: '#/components/responses/CandidateErasureErrorResponse'
        '423':
          description: Erasure blocked by an active legal hold; no local data was changed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateErasureBlockedResponse'
        '429':
          $ref: '#/components/responses/CandidateErasureRateLimitedResponse'
        '503':
          $ref: '#/components/responses/CandidateErasureErrorResponse'
    patch:
      operationId: operateCandidateErasureQueue
      summary: List durable work, inspect provider authority, or record administrator-reported evidence
      description: >-
        Administrator-only queue and provider-obligation operation. List returns at most 100
        non-final requests without provider authority. Inspect decrypts one exact workspace-bound
        authority reference and audits the access. Complete uses optimistic attempt authority and
        records an administrator-reported SHA-256 evidence digest plus provider case reference. ARIA
        does not inspect the evidence artifact or call the provider. It remains 202 until all
        obligations have administrator-recorded completion. A legal hold placed after local
        scrubbing blocks both inspection and completion with a typed 423.
      x-aria-contract-version: '2026-07-14'
      x-aria-max-body-bytes: 2500
      x-aria-request-throttle:
        storage: per-instance-memory
        windowSeconds: 60
        maxRequests: 20
        keyDimensions:
          - route
          - trusted-proxy-address
          - authenticated-user
      parameters:
        - $ref: '#/components/parameters/SameOriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateErasureObligationAction'
      responses:
        '200':
          description: >-
            Queue returned, provider authority returned for explicit admin use, or every erasure
            obligation completed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CandidateErasureQueueResponse'
                  - $ref: '#/components/schemas/CandidateErasureAuthorityResponse'
                  - $ref: '#/components/schemas/CandidateErasureResponse'
        '202':
          description: One provider deletion was recorded but other obligations remain non-final.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateErasureResponse'
        '400':
          $ref: '#/components/responses/CandidateErasureErrorResponse'
        '401':
          $ref: '#/components/responses/CandidateErasureErrorResponse'
        '403':
          $ref: '#/components/responses/CandidateErasureErrorResponse'
        '404':
          $ref: '#/components/responses/CandidateErasureErrorResponse'
        '409':
          $ref: '#/components/responses/CandidateErasureErrorResponse'
        '413':
          $ref: '#/components/responses/CandidateErasureErrorResponse'
        '415':
          $ref: '#/components/responses/CandidateErasureErrorResponse'
        '423':
          $ref: '#/components/responses/CandidateErasureErrorResponse'
        '429':
          $ref: '#/components/responses/CandidateErasureRateLimitedResponse'
        '503':
          $ref: '#/components/responses/CandidateErasureErrorResponse'
components:
  parameters:
    SameOriginHeader:
      in: header
      name: Origin
      required: true
      schema:
        type: string
        format: uri
      description: Must exactly equal the request URL origin.
  headers:
    CacheControlNoStore:
      description: Prevents storage of sourcing and enrichment responses.
      schema:
        type: string
        const: no-store
    PragmaNoCache:
      description: Legacy no-cache directive emitted by the route.
      schema:
        type: string
        const: no-cache
    ContentTypeOptionsNoSniff:
      description: Disables MIME sniffing.
      schema:
        type: string
        const: nosniff
    RetryAfterSeconds:
      description: Whole seconds until this route instance accepts another request.
      schema:
        type: integer
        minimum: 1
  schemas:
    CandidateErasureRequest:
      type: object
      additionalProperties: false
      required:
        - campaignId
        - candidateId
      properties:
        campaignId:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,119}$
        candidateId:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,119}$
    CandidateErasureObligation:
      type: object
      additionalProperties: false
      required:
        - id
        - provider
        - status
        - attemptCount
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z][a-z0-9._:-]{0,63}$
        status:
          type: string
          enum:
            - pending_provider
            - manual_required
            - retryable_failure
            - completed
            - blocked_legal_hold
        attemptCount:
          type: integer
          minimum: 0
          maximum: 100
    CandidateErasureResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - completed
        - status
        - requestId
        - campaignId
        - candidateId
        - replayed
        - scrubCounts
        - obligations
      properties:
        ok:
          type: boolean
          const: true
        completed:
          type: boolean
          description: True only when status is completed and every provider obligation is completed.
        status:
          type: string
          enum:
            - pending_provider
            - manual_required
            - retryable_failure
            - completed
        requestId:
          type: string
          format: uuid
        campaignId:
          type: string
        candidateId:
          type: string
        replayed:
          type: boolean
        scrubCounts:
          type: object
          maxProperties: 20
          additionalProperties:
            type: integer
            minimum: 0
          description: Per-store row counts only; never candidate content.
        obligations:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CandidateErasureObligation'
    CandidateErasureQueueItem:
      type: object
      additionalProperties: false
      required:
        - ok
        - completed
        - status
        - requestId
        - campaignId
        - candidateId
        - replayed
        - scrubCounts
        - obligations
      properties:
        ok:
          type: boolean
          const: true
        completed:
          type: boolean
          const: false
          description: Always false for a non-final queue item.
        status:
          type: string
          enum:
            - pending_provider
            - manual_required
            - retryable_failure
            - blocked_legal_hold
        requestId:
          type: string
          format: uuid
        campaignId:
          type: string
        candidateId:
          type: string
        replayed:
          type: boolean
        scrubCounts:
          type: object
          maxProperties: 20
          additionalProperties:
            type: integer
            minimum: 0
          description: Per-store row counts only; never candidate content.
        obligations:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CandidateErasureObligation'
    CandidateErasureQueueResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - requests
      properties:
        ok:
          type: boolean
          const: true
        requests:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CandidateErasureQueueItem'
          description: Non-final requests only; encrypted provider authority is omitted.
    CandidateErasureObligationAction:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - action
          properties:
            action:
              type: string
              const: list
        - type: object
          additionalProperties: false
          required:
            - action
            - obligationId
          properties:
            action:
              type: string
              const: inspect
            obligationId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required:
            - action
            - obligationId
            - expectedAttemptCount
            - evidenceSha256
            - caseReference
          properties:
            action:
              type: string
              const: complete
            obligationId:
              type: string
              format: uuid
            expectedAttemptCount:
              type: integer
              minimum: 0
              maximum: 100
            evidenceSha256:
              type: string
              pattern: ^[0-9a-f]{64}$
            caseReference:
              type: string
              minLength: 1
              maxLength: 120
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:/#-]{0,119}$
    CandidateErasureSourceRecordReference:
      type: object
      additionalProperties: false
      required:
        - kind
        - provider
        - campaignId
      properties:
        kind:
          type: string
          const: source_record
        provider:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z][a-z0-9._:-]{0,63}$
        campaignId:
          type: string
          minLength: 1
          maxLength: 120
        externalId:
          type: string
          minLength: 1
          maxLength: 200
        authorityId:
          type: string
          minLength: 1
          maxLength: 200
        sourceUrl:
          type: string
          minLength: 1
          maxLength: 1000
        lookupEmail:
          type: string
          minLength: 1
          maxLength: 320
        lookupName:
          type: string
          minLength: 1
          maxLength: 200
    CandidateErasureMessageRecordReference:
      type: object
      additionalProperties: false
      required:
        - kind
        - recordId
        - direction
        - channel
        - providerMessageId
      properties:
        kind:
          type: string
          const: message_record
        recordId:
          type: string
          format: uuid
        direction:
          type: string
          enum:
            - inbound
            - outbound
        channel:
          type: string
          enum:
            - email
            - linkedin
            - whatsapp
            - sms
        providerMessageId:
          type: string
          minLength: 1
          maxLength: 512
    CandidateErasureApolloProfileReference:
      type: object
      additionalProperties: false
      required:
        - kind
        - targetId
        - campaignId
        - providerExternalId
      properties:
        kind:
          type: string
          const: apollo_profile
        targetId:
          type: string
          format: uuid
        campaignId:
          type: string
          minLength: 1
          maxLength: 120
        providerExternalId:
          type: string
          minLength: 1
          maxLength: 200
    CandidateErasureProviderReference:
      oneOf:
        - $ref: '#/components/schemas/CandidateErasureSourceRecordReference'
        - $ref: '#/components/schemas/CandidateErasureMessageRecordReference'
        - $ref: '#/components/schemas/CandidateErasureApolloProfileReference'
    CandidateErasureAuthorityResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - status
        - obligationId
        - provider
        - attemptCount
        - reference
      properties:
        ok:
          type: boolean
          const: true
        status:
          type: string
          enum:
            - pending_provider
            - manual_required
            - retryable_failure
        obligationId:
          type: string
          format: uuid
        provider:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z][a-z0-9._:-]{0,63}$
        attemptCount:
          type: integer
          minimum: 0
          maximum: 100
        reference:
          $ref: '#/components/schemas/CandidateErasureProviderReference'
    CandidateErasureError:
      type: object
      additionalProperties: false
      required:
        - ok
        - completed
        - code
        - requestId
      properties:
        ok:
          type: boolean
          const: false
        completed:
          type: boolean
          const: false
        code:
          type: string
          enum:
            - invalid_request
            - cross_origin_request
            - not_authenticated
            - insufficient_permissions
            - candidate_not_found
            - idempotency_conflict
            - candidate_erasure_obligation_not_found
            - candidate_erasure_obligation_conflict
            - candidate_erasure_obligation_completed
            - candidate_erasure_obligation_limit_exceeded
            - candidate_erasure_blocked_legal_hold
            - candidate_erasure_rate_limited
            - candidate_erasure_unavailable
        requestId:
          type: string
          minLength: 1
          maxLength: 100
    CandidateErasureBlockedResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - completed
        - code
        - status
        - requestId
        - campaignId
        - candidateId
        - replayed
        - scrubCounts
        - obligations
      properties:
        ok:
          type: boolean
          const: false
        completed:
          type: boolean
          const: false
        code:
          type: string
          const: candidate_erasure_blocked_legal_hold
        status:
          type: string
          const: blocked_legal_hold
        requestId:
          type: string
          format: uuid
        campaignId:
          type: string
        candidateId:
          type: string
        replayed:
          type: boolean
        scrubCounts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        obligations:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CandidateErasureObligation'
  responses:
    CandidateErasureErrorResponse:
      description: Candidate erasure request rejected or unavailable; completion is always false.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Pragma:
          $ref: '#/components/headers/PragmaNoCache'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptionsNoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CandidateErasureError'
    CandidateErasureRateLimitedResponse:
      description: The route-specific per-instance admin throttle rejected the request.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfterSeconds'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Pragma:
          $ref: '#/components/headers/PragmaNoCache'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptionsNoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CandidateErasureError'
