# Integration packaging. Memory caps sum to under 6 GiB. Swap is capped at the
# same size so a service cannot grow past its limit. Nothing here is a product
# behavior change.

x-cap: &cap
  memswap_limit: 128m

services:
  db:
    mem_limit: 640m
    memswap_limit: 640m
  db-init:
    mem_limit: 96m
    memswap_limit: 96m
  auth:
    mem_limit: 192m
    memswap_limit: 192m
  rest:
    mem_limit: 160m
    memswap_limit: 160m
  gateway:
    mem_limit: 96m
    memswap_limit: 96m
  supabase-bootstrap:
    mem_limit: 96m
    memswap_limit: 96m
  app:
    mem_limit: 1280m
    memswap_limit: 1280m

  odoo-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    mem_limit: 256m
    memswap_limit: 256m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    image: odoo:19
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    mem_limit: 1408m
    memswap_limit: 1408m
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - ./odoo_addons:/mnt/extra-addons:ro
    command: ["odoo", "--workers=0", "--max-cron-threads=0", "-d", "aria_integration", "-i", "aria_recruitment", "--without-demo=all"]

  aria-go:
    build:
      context: ./services
      dockerfile: ../e2e/integration/services.Dockerfile
    mem_limit: 192m
    memswap_limit: 192m
    environment:
      ARIA_MODE: test
      ARIA_RECIPIENT_ALLOWLIST: ada@example.test
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  # The product Dockerfile pins poppler-utils to a revision whose library
  # dependency no longer resolves. The sweep records that. This service only
  # keeps a slot in the stack so the other services can still start.
  ingest:
    image: debian:bookworm-slim
    mem_limit: 64m
    memswap_limit: 64m
    entrypoint: ["sleep", "infinity"]
