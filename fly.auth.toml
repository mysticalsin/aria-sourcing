# aria-mantu-auth — GoTrue (stock image). INTERNAL ONLY, reached at aria-mantu-auth.internal:9999.
app            = "aria-mantu-auth"
primary_region = "cdg"

[build]
  image = "supabase/gotrue:v2.189.0@sha256:385184459f57569c54c25209f51f3b2be99ddd7c4ce9e3555b5d3eea8447b7cf"

[env]
  GOTRUE_API_HOST               = "::"                          # bind IPv6 for the 6PN .internal net
  GOTRUE_API_PORT               = "9999"
  API_EXTERNAL_URL              = "https://aria-mantu-kong.fly.dev"   # was http://localhost:54321
  GOTRUE_SITE_URL               = "https://aria-mantu-app.fly.dev"    # was http://localhost:3000
  GOTRUE_URI_ALLOW_LIST         = "https://aria-mantu-app.fly.dev/**" # was "*"
  # IMPORTANT: GOTRUE_SITE_URL and API_EXTERNAL_URL must NOT be Fly secrets.
  # Secrets override [env] values. If redirects go to 0.0.0.0:3000, check:
  # fly secrets list -a aria-mantu-auth
  # If either appears, unset it: fly secrets unset GOTRUE_SITE_URL -a aria-mantu-auth
  GOTRUE_DB_DRIVER              = "postgres"
  GOTRUE_PASSWORD_MIN_LENGTH    = "5"                           # owner-set floor (default 6); short admin password by request
  GOTRUE_DISABLE_SIGNUP         = "true"                        # single-admin tenant (was "false"); see runbook step 11
  GOTRUE_JWT_ADMIN_ROLES        = "service_role"
  GOTRUE_JWT_AUD                = "authenticated"
  GOTRUE_JWT_DEFAULT_GROUP_NAME = "authenticated"
  GOTRUE_JWT_EXP                = "3600"
  GOTRUE_EXTERNAL_EMAIL_ENABLED = "true"
  GOTRUE_MAILER_AUTOCONFIRM     = "true"                        # ok for single-admin; flip false + SMTP for multi-user
  # Secrets (fly secrets set): GOTRUE_JWT_SECRET (=FLY_JWT_SECRET),
  #   GOTRUE_DB_DATABASE_URL = postgres://supabase_auth_admin:<FLY_AUTH_DB_PASSWORD>@aria-mantu-db.internal:5432/postgres

[[services]]
  internal_port = 9999
  protocol      = "tcp"
  auto_stop_machines   = "off"
  auto_start_machines  = false
  min_machines_running = 1
  # no external ports → internal only
  [[services.tcp_checks]]
    grace_period = "20s"
    interval     = "15s"
    timeout      = "3s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
