name: Services (Go)

# Same push set as ci.yml. ubuntu-latest has stayed queued with no runner.

on:
  push:
    branches: [vercel-demo, main, twa-odoo]
  pull_request:
    branches: ["**"]

# One group per workflow and branch. Pull requests cancel a stale run.
# Pushes to the default branch and twa-odoo do not.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || (github.ref != 'refs/heads/twa-odoo' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

permissions:
  contents: read

jobs:
  go:
    name: Go test and bench
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services
    env:
      GOPROXY: off
      GOFLAGS: -mod=readonly
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.22"
          cache: false

      - name: Test
        run: go test ./...

      - name: Bench
        run: go test -bench=. -benchmem -run='^$' -benchtime=100ms ./...
