name: Ingest

on:
  push:
    paths:
      - "services/ingest/**"
      - ".github/workflows/ingest.yml"
  pull_request:
    paths:
      - "services/ingest/**"
      - ".github/workflows/ingest.yml"

permissions:
  contents: read

jobs:
  test:
    name: CV ingest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.22"
          cache-dependency-path: services/ingest/go.sum

      - name: Install Tesseract and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-fra \
            tesseract-ocr-por

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test -race -count=1 ./...

      - name: Benchmark text-layer throughput
        run: go test -bench=BenchmarkIngestTextCVs -benchmem -benchtime=1s -count=1 -run=^$ .
