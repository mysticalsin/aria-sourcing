name: Fairness

on:
  push:
    paths:
      - "go/fairness/**"
      - "cmd/aria-fairness/**"
      - "src/lib/fairness/**"
      - "tests/fairness-live-rank.mts"
      - ".github/workflows/fairness.yml"
  pull_request:
    paths:
      - "go/fairness/**"
      - "cmd/aria-fairness/**"
      - "src/lib/fairness/**"
      - "tests/fairness-live-rank.mts"
      - ".github/workflows/fairness.yml"

permissions:
  contents: read

jobs:
  test:
    name: Synthetic fairness audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.22"
          cache: false

      - name: Test the audit library
        working-directory: go/fairness
        run: go test ./...

      - name: Test the report command
        working-directory: cmd/aria-fairness
        run: go test ./...
