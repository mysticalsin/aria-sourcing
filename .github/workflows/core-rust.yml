name: Core

on:
  push:
    paths:
      - "core/**"
      - ".github/workflows/core-rust.yml"
  pull_request:
    paths:
      - "core/**"
      - ".github/workflows/core-rust.yml"

permissions:
  contents: read

jobs:
  test:
    name: Rust and Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.22"
          cache: false

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: core-cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: core-cargo-${{ runner.os }}-

      - name: Test the Rust workspace
        run: cargo test --manifest-path core/Cargo.toml --workspace

      - name: Compile criterion benches
        run: cargo bench --manifest-path core/Cargo.toml -p aria-scoring --no-run

      - name: Build the C ABI
        run: cargo build --release --manifest-path core/Cargo.toml -p aria-ffi

      - name: Test the Go cgo binding
        working-directory: core/go/aria
        run: go test -count=1 .

  bench:
    name: p95 regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # A pull_request checkout is a merge commit. Its first parent is the
          # base branch, which has no bench. Measure the branch commit against
          # that commit's own parent, on this runner.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.22"
          cache: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Prove the p95 gate fails on an injected slowdown
        run: node --test core/scripts/check-p95.test.mjs

      - name: Measure head and parent p95 on this runner
        run: |
          set -euo pipefail
          measure() {
            local manifest="$1"
            local out="$2"
            cargo build --release --manifest-path "$manifest" -p aria-bench -p aria-ffi
            cargo run --release --manifest-path "$manifest" -p aria-bench --bin aria-p95 > "$out/rust-p95.json"
            (
              cd "$(dirname "$manifest")/go/aria"
              ARIA_MEASURE_P95=1 go test -count=1 -run TestMeasureFFIBatchP95 -v
            ) | tee "$out/ffi-p95.txt"
          }
          mkdir -p core/bench /tmp/head-bench
          measure core/Cargo.toml /tmp/head-bench
          node core/scripts/bench-ts.mjs > core/bench/ts-p95.json
          python3 - << 'PY'
          import json, pathlib, re, os
          def load(directory):
              rust = json.loads(pathlib.Path(directory, "rust-p95.json").read_text().strip().splitlines()[-1])
              text = pathlib.Path(directory, "ffi-p95.txt").read_text()
              match = re.search(r'\{"name":"ffi_score_batch_500_p95".*\}', text)
              if not match:
                  raise SystemExit("ffi p95 missing in " + directory)
              ffi = json.loads(match.group(0))
              return [
                  {"name": rust["name"], "unit": "ns", "value": rust["value"], "p50_ns": rust.get("p50_ns")},
                  {"name": ffi["name"], "unit": "ns", "value": ffi["value"]},
              ]
          head = load("/tmp/head-bench")
          ts = json.loads(pathlib.Path("core/bench/ts-p95.json").read_text().strip().splitlines()[-1])
          gated = [{"name": row["name"], "unit": "ns", "value": row["value"]} for row in head]
          pathlib.Path("core/bench/current-gate.json").write_text(json.dumps(gated, indent=2) + "\n")
          pathlib.Path("core/bench/ci-measurement.json").write_text(json.dumps({
              "measured_in": "CI",
              "rust_batch_500_p95_ns": head[0]["value"],
              "rust_p50_ns": head[0].get("p50_ns"),
              "ffi_batch_500_p95_ns": head[1]["value"],
              "typescript_batch_500_p95_ns": ts["value"],
              "typescript_p50_ns": ts.get("p50_ns"),
          }, indent=2) + "\n")
          print(pathlib.Path("core/bench/ci-measurement.json").read_text())
          PY
          if git rev-parse --verify --quiet HEAD^ >/dev/null && git cat-file -e "HEAD^:core/crates/aria-bench/src/main.rs"; then
            git worktree add --detach /tmp/aria-parent HEAD^
            mkdir -p /tmp/parent-bench
            measure /tmp/aria-parent/core/Cargo.toml /tmp/parent-bench
            python3 - << 'PY'
          import json, pathlib, re
          text = pathlib.Path("/tmp/parent-bench/ffi-p95.txt").read_text()
          ffi = json.loads(re.search(r'\{"name":"ffi_score_batch_500_p95".*\}', text).group(0))
          rust = json.loads(pathlib.Path("/tmp/parent-bench/rust-p95.json").read_text().strip().splitlines()[-1])
          rows = [
              {"name": rust["name"], "unit": "ns", "value": rust["value"]},
              {"name": ffi["name"], "unit": "ns", "value": ffi["value"]},
          ]
          pathlib.Path("/tmp/parent-gate.json").write_text(json.dumps(rows, indent=2) + "\n")
          print("parent", rows)
          PY
            node core/scripts/check-p95.mjs --history /tmp/parent-gate.json --current core/bench/current-gate.json
          else
            echo "parent commit has no scoring bench; first sample is recorded without a 10% comparison"
          fi

      - name: github-action-benchmark
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Aria core p95
          tool: customSmallerIsBetter
          output-file-path: core/bench/current-gate.json
          external-data-json-path: core/bench/ci-history/benchmark-action.json
          # The 10% fail line is the same-runner parent comparison above.
          # This chart must not fail the job by comparing a different runner's sample.
          fail-on-alert: false
          alert-threshold: "110%"
          comment-on-alert: false
          auto-push: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary-always: true
