name: CI

on:
  # Run on pushes to the long-lived integration branches only. Feature
  # branches are covered by the pull_request event, so restricting push here
  # avoids running every workflow twice per commit (push + PR) and roughly
  # halves Actions minutes usage.
  push:
    branches: ["vercel-demo", "main", "master"]
  pull_request:
    branches: ["**"]

# Cancel an in-progress run when a newer commit arrives for the same ref, so
# superseded runs don't keep burning Actions minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck / Lint / Test / Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # The job runs directly on the runner (not inside a container), so unlike
      # docker-compose.yml's internal-network-only wiring, the sidecar's port must
      # be published to the runner's localhost for the test process to reach it --
      # this is a CI-only difference in how the port is reached, not a change to
      # the sidecar itself (still built from source, pinned commit, default
      # cargo features, no --stealth/--allow-private-network -- see
      # docker/obscura/Dockerfile).
      - name: Build Obscura sidecar image
        run: docker build -t aria-obscura-ci ./docker/obscura

      - name: Start Obscura sidecar
        run: docker run -d --name obscura-ci -p 9222:9222 aria-obscura-ci

      - name: Obscura integration test
        env:
          OBSCURA_URL: http://127.0.0.1:9222
        run: npm run test:obscura

      - name: Stop Obscura sidecar
        if: always()
        run: docker rm -f obscura-ci

      - name: Build
        run: npm run build

      # BLOCKING gate: high/critical advisories fail CI (no "|| true").
      # Known Next.js advisories must be resolved via the Next upgrade tracked
      # separately; do not re-add "|| true" to silence this gate.
      - name: Audit (high-severity, blocking)
        run: npm audit --audit-level=high

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
