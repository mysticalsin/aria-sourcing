name: CI

# Push runs only on long-lived integration/release refs. Feature branches are
# covered by pull_request so a PR push does not burn two full suites.
on:
  push:
    branches:
      - main
      - vercel-demo
      - integration/**
      - deploy/**
      - consolidate/**
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify orphan-owner recovery operator contract
        run: npm run test:owner-recovery

      - name: Build Obscura sidecar image
        run: docker build -t aria-obscura-ci ./docker/obscura

      - name: Start Obscura sidecar
        run: docker run -d --name obscura-ci -p 9222:9222 aria-obscura-ci

      - name: Wait for Obscura sidecar
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:9222/json/version >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs obscura-ci
          exit 1

      - name: Obscura integration test
        env:
          ARIA_REQUIRE_OBSCURA_TEST: "true"
          OBSCURA_URL: http://127.0.0.1:9222
        run: npm run test:obscura

      - name: Stop Obscura sidecar
        if: always()
        run: docker rm -f obscura-ci

      - name: Build
        run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependency graph without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit high and critical advisories
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install checksum-pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors --connect-timeout 10 --max-time 120 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict -
          tar --extract --gzip --file "$archive" --directory "$install_dir" gitleaks
          test "$("$install_dir/gitleaks" version)" = "$GITLEAKS_VERSION"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Scan full history including the current release commit
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git . --redact=100 --no-banner --config .gitleaks.toml --log-opts='--all'

  database-security:
    name: Database security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify effective database authority
        run: npm run test:db-privileges

      - name: Verify cross-channel cap serialization
        run: npm run test:db-cross-channel-cap

      - name: Verify agent memory authority
        run: npm run test:db-agent-memory

      - name: Verify agent operational rollback authority
        run: npm run test:db-agent-operational-rollback

      - name: Verify candidate erasure authority
        run: npm run test:db-candidate-erasure

      - name: Verify candidates corpus mirror authority
        run: npm run test:db-candidates-corpus

      - name: Verify person identity model
        run: npm run test:db-person-model

      - name: Verify autonomous-loop job spine authority
        run: npm run test:db-loop-jobs

      - name: Verify Apollo enrichment authority
        run: npm run test:db-apollo-enrichment

      - name: Verify adaptive sourcing authority
        run: npm run test:db-sourcing-learning

      - name: Verify conversation and message authority
        run: npm run test:db-conversation-authority

      - name: Verify DeerFlow and Flowise database authority
        run: npm run test:db-agent-framework

      - name: Verify orphan-owner recovery database authority
        run: npm run test:db-owner-recovery

      - name: Prove Fly database volume and restart behavior
        run: npm run test:fly-db-volume

  supply-chain:
    name: Production image supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARIA_CI_IMAGE: aria-msourcing:ci-${{ github.sha }}
      ARIA_CI_DB_IMAGE: aria-msourcing-db:ci-${{ github.sha }}
      ARIA_CI_BOOTSTRAP_IMAGE: aria-msourcing-bootstrap:ci-${{ github.sha }}
      ARIA_CI_KONG_IMAGE: aria-msourcing-kong:ci-${{ github.sha }}
      ARIA_CI_GRAPHIFY_IMAGE: aria-graphify-lessons:ci-${{ github.sha }}
      # Trivy v0.72.0 OCI index digest, verified against Docker Hub on 2026-07-11.
      TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
      # Official CycloneDX CLI v0.32.0 OCI index digest, verified on 2026-07-11.
      CYCLONEDX_CLI_IMAGE: cyclonedx/cyclonedx-cli:0.32.0@sha256:9a858a15e7b0843606efc0ff19d5f7575011a5428d7f3d343b4f6cf09d8f0d4e

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install pinned Cosign verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify the pinned Trivy scanner signature
        run: |
          set -euo pipefail
          cosign verify "$TRIVY_IMAGE" \
            --certificate-identity-regexp 'https://github\.com/aquasecurity/trivy/\.github/workflows/.+' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            >/dev/null

      - name: Build every production custom image
        run: |
          set -euo pipefail
          docker build \
            --pull \
            --platform linux/amd64 \
            --file Dockerfile.prod \
            --tag "$ARIA_CI_IMAGE" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://aria-ci.invalid \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-public-anon-key \
            --build-arg NEXT_PUBLIC_ALLOWED_EMAIL_DOMAIN=example.invalid \
            --build-arg NEXT_PUBLIC_ENABLE_DEMO_LOGIN=false \
            .
          docker build --pull --platform linux/amd64 \
            --file docker/db/Dockerfile.fly \
            --tag "$ARIA_CI_DB_IMAGE" \
            .
          docker build --pull --platform linux/amd64 \
            --file docker/bootstrap/Dockerfile.fly \
            --tag "$ARIA_CI_BOOTSTRAP_IMAGE" \
            .
          docker build --pull --platform linux/amd64 \
            --file docker/kong/Dockerfile.fly \
            --tag "$ARIA_CI_KONG_IMAGE" \
            .
          docker build --pull --platform linux/amd64 \
            --file workers/graphify-lessons/Dockerfile \
            --tag "$ARIA_CI_GRAPHIFY_IMAGE" \
            workers/graphify-lessons
          GRAPHIFY_IMAGE="$ARIA_CI_GRAPHIFY_IMAGE" npm run test:graphify-learning
          mkdir -p "$RUNNER_TEMP/aria-scan-input"
          for specification in \
            "app|$ARIA_CI_IMAGE" \
            "db|$ARIA_CI_DB_IMAGE" \
            "bootstrap|$ARIA_CI_BOOTSTRAP_IMAGE" \
            "kong|$ARIA_CI_KONG_IMAGE" \
            "graphify|$ARIA_CI_GRAPHIFY_IMAGE"
          do
            IFS='|' read -r component image <<< "$specification"
            docker image save \
              --output "$RUNNER_TEMP/aria-scan-input/aria-$component-image.tar" \
              "$image"
          done

      - name: Generate and schema-validate the package-only CycloneDX SBOM
        run: |
          set -euo pipefail
          mkdir -p artifacts/supply-chain .trivy-cache
          validate_cyclonedx() {
            local host_dir="$1" file="$2"
            docker run --rm \
              --network none \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --tmpfs /tmp:rw,noexec,nosuid,size=16m \
              --volume "$host_dir:/artifacts:ro" \
              "$CYCLONEDX_CLI_IMAGE" validate \
              --input-file "/artifacts/$file" \
              --input-format json \
              --input-version v1_7 \
              --fail-on-errors
          }

          export ARIA_CYCLONEDX_PROBE_DIR="$PWD/artifacts/supply-chain"
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const dir = process.env.ARIA_CYCLONEDX_PROBE_DIR;
          fs.writeFileSync(
            path.join(dir, "validator-valid.cdx.json"),
            `${JSON.stringify({ bomFormat: "CycloneDX", specVersion: "1.7", version: 1 })}\n`,
          );
          fs.writeFileSync(
            path.join(dir, "validator-invalid.cdx.json"),
            `${JSON.stringify({ bomFormat: "CycloneDX", specVersion: "1.7", version: 0, unexpected: true })}\n`,
          );
          NODE
          validate_cyclonedx "$PWD/artifacts/supply-chain" validator-valid.cdx.json
          if validate_cyclonedx "$PWD/artifacts/supply-chain" validator-invalid.cdx.json >/dev/null 2>&1; then
            echo "::error::CycloneDX validator accepted the malformed control document"
            exit 1
          fi
          rm -f artifacts/supply-chain/validator-valid.cdx.json artifacts/supply-chain/validator-invalid.cdx.json

          for component in app db bootstrap kong graphify; do
            docker run --rm \
              --volume "$RUNNER_TEMP/aria-scan-input:/image:ro" \
              --volume "$PWD/.trivy-cache:/trivy-cache" \
              --volume "$PWD/artifacts/supply-chain:/artifacts" \
              "$TRIVY_IMAGE" image \
              --input "/image/aria-$component-image.tar" \
              --cache-dir /trivy-cache \
              --format cyclonedx \
              --output "/artifacts/aria-$component.cdx.json" \
              --timeout 15m
            validate_cyclonedx "$PWD/artifacts/supply-chain" "aria-$component.cdx.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path

          for name in ("app", "db", "bootstrap", "kong", "graphify"):
              path = Path(f"artifacts/supply-chain/aria-{name}.cdx.json")
              document = json.loads(path.read_text(encoding="utf-8"))
              component = document.get("metadata", {}).get("component", {})
              if document.get("bomFormat") != "CycloneDX":
                  raise SystemExit(f"{name} SBOM is not CycloneDX")
              if component.get("type") != "container":
                  raise SystemExit(f"{name} SBOM metadata is not a container")
              if not document.get("components"):
                  raise SystemExit(f"{name} SBOM component inventory is empty")
          PY
          (
            cd artifacts/supply-chain
            for component in app db bootstrap kong graphify; do
              sha256sum "aria-$component.cdx.json" > "aria-$component.cdx.json.sha256"
            done
          )

      - name: Block high and critical production-image vulnerabilities
        run: |
          set -euo pipefail
          # linkedin-client-id detects a public OAuth client identifier (not a
          # credential) and false-fires on Sillage request field names compiled into
          # the app bundle. The linkedin-client-secret rule remains armed.
          cat > artifacts/supply-chain/trivy-secret.yaml <<'YAML'
          disable-rules:
            - linkedin-client-id
          YAML
          for component in app db bootstrap kong graphify; do
            docker run --rm \
              --volume "$RUNNER_TEMP/aria-scan-input:/image:ro" \
              --volume "$PWD/.trivy-cache:/trivy-cache" \
              --volume "$PWD/artifacts/supply-chain:/artifacts" \
              "$TRIVY_IMAGE" image \
              --input "/image/aria-$component-image.tar" \
              --cache-dir /trivy-cache \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed=true \
              --exit-code 1 \
              --format json \
              --output "/artifacts/aria-$component-vulnerabilities.json" \
              --timeout 15m
            docker run --rm \
              --volume "$RUNNER_TEMP/aria-scan-input:/image:ro" \
              --volume "$PWD/.trivy-cache:/trivy-cache" \
              --volume "$PWD/artifacts/supply-chain:/artifacts" \
              "$TRIVY_IMAGE" image \
              --input "/image/aria-$component-image.tar" \
              --cache-dir /trivy-cache \
              --scanners secret \
              --image-config-scanners secret \
              --secret-config /artifacts/trivy-secret.yaml \
              --exit-code 1 \
              --format json \
              --output "/artifacts/aria-$component-secrets.json" \
              --timeout 15m
          done

      - name: Archive non-secret supply-chain reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aria-production-supply-chain-${{ github.sha }}
          path: |
            artifacts/supply-chain/aria-*.cdx.json
            artifacts/supply-chain/aria-*.cdx.json.sha256
            artifacts/supply-chain/aria-*-vulnerabilities.json
            artifacts/supply-chain/aria-*-secrets.json
          if-no-files-found: error
          retention-days: 30

  release-gate:
    name: Release gate
    if: always()
    needs: [quality, dependency-audit, secret-scan, database-security, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every CI job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          DATABASE_SECURITY_RESULT: ${{ needs.database-security.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
        run: |
          if [ "$QUALITY_RESULT" != success ] || [ "$AUDIT_RESULT" != success ] || [ "$SECRET_SCAN_RESULT" != success ] || [ "$DATABASE_SECURITY_RESULT" != success ] || [ "$SUPPLY_CHAIN_RESULT" != success ]; then
            echo "::error::release gate failed: quality=$QUALITY_RESULT audit=$AUDIT_RESULT secret_scan=$SECRET_SCAN_RESULT database_security=$DATABASE_SECURITY_RESULT supply_chain=$SUPPLY_CHAIN_RESULT"
            exit 1
          fi
