name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependency graph without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit high and critical advisories
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install checksum-pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors --connect-timeout 10 --max-time 120 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict -
          tar --extract --gzip --file "$archive" --directory "$install_dir" gitleaks
          test "$("$install_dir/gitleaks" version)" = "$GITLEAKS_VERSION"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Scan full history including the current release commit
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git . --redact=100 --no-banner --config .gitleaks.toml --log-opts='--all'

  database-security:
    name: Database security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify cross-channel cap serialization
        run: npm run test:db-cross-channel-cap

      - name: Verify candidate erasure authority
        run: npm run test:db-candidate-erasure

      - name: Verify candidates corpus mirror authority
        run: npm run test:db-candidates-corpus

      - name: Verify person identity model
        run: npm run test:db-person-model

      - name: Verify adaptive sourcing authority
        run: npm run test:db-sourcing-learning

      - name: Verify conversation and message authority
        run: npm run test:db-conversation-authority

      - name: Verify schema function privileges, workspace provisioning, and Dust authority
        run: npm run test:db-schema-authority

      - name: Verify email outbox durability
        run: npm run test:db-email-durability

      - name: Verify inbound email correlation
        run: npm run test:db-email-inbound

      - name: Verify candidate outcome events
        run: npm run test:db-email-outcomes

  release-gate:
    name: Release gate
    if: always()
    needs: [quality, dependency-audit, secret-scan, database-security]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every CI job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          DATABASE_SECURITY_RESULT: ${{ needs.database-security.result }}
        run: |
          if [ "$QUALITY_RESULT" != success ] || [ "$AUDIT_RESULT" != success ] || [ "$SECRET_SCAN_RESULT" != success ] || [ "$DATABASE_SECURITY_RESULT" != success ]; then
            echo "::error::release gate failed: quality=$QUALITY_RESULT audit=$AUDIT_RESULT secret_scan=$SECRET_SCAN_RESULT database_security=$DATABASE_SECURITY_RESULT"
            exit 1
          fi
