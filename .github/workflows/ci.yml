name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Typecheck / Lint / Test / Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks diffs HEAD^ on push and <oldest PR commit>^..HEAD on
          # pull_request. Depth 1 has no parent: push then scans the whole tree
          # as a new commit, and pull_request dies on an unknown revision.
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # The job runs directly on the runner (not inside a container), so unlike
      # docker-compose.yml's internal-network-only wiring, the sidecar's port must
      # be published to the runner's localhost for the test process to reach it --
      # this is a CI-only difference in how the port is reached, not a change to
      # the sidecar itself (still built from source, pinned commit, default
      # cargo features, no --stealth/--allow-private-network -- see
      # docker/obscura/Dockerfile).
      - name: Build Obscura sidecar image
        run: docker build -t aria-obscura-ci ./docker/obscura

      - name: Start Obscura sidecar
        run: docker run -d --name obscura-ci -p 9222:9222 aria-obscura-ci

      - name: Obscura integration test
        env:
          OBSCURA_URL: http://127.0.0.1:9222
        run: npm run test:obscura

      - name: Stop Obscura sidecar
        if: always()
        run: docker rm -f obscura-ci

      - name: Build
        run: npm run build

      # BLOCKING gate: high/critical advisories fail CI (no "|| true").
      # Known Next.js advisories must be resolved via the Next upgrade tracked
      # separately; do not re-add "|| true" to silence this gate.
      - name: Audit (high-severity, blocking)
        run: npm audit --audit-level=high

      # actions/checkout defaults to depth 1. gitleaks then asks git for
      # <base>^..<head>, and that parent is not in the shallow clone, so the
      # scan exits 1 before it reads a diff. Unshallow only for this step.
      - name: Fetch history for the secret scan
        run: |
          if git rev-parse --is-shallow-repository | grep -qx true; then
            git fetch --prune --unshallow origin
          fi

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
