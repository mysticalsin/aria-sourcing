name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependency graph without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit high and critical advisories
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install checksum-pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors --connect-timeout 10 --max-time 120 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict -
          tar --extract --gzip --file "$archive" --directory "$install_dir" gitleaks
          test "$("$install_dir/gitleaks" version)" = "$GITLEAKS_VERSION"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Scan the history of this checkout
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git . --redact=100 --no-banner --config .gitleaks.toml --log-opts='--all'
          git rev-list --all > "$RUNNER_TEMP/all-commits"
          while IFS= read -r line; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            sha="${line%%:*}"
            grep -qx "$sha" "$RUNNER_TEMP/all-commits" || {
              echo "gitleaks ignore commit is not reachable with --all: $sha" >&2
              exit 1
            }
          done < .gitleaksignore

  database-security:
    name: Database security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify cross-channel cap serialization
        run: npm run test:db-cross-channel-cap

      - name: Verify candidate erasure authority
        run: npm run test:db-candidate-erasure

      - name: Verify candidates corpus mirror authority
        run: npm run test:db-candidates-corpus

      - name: Verify person identity model
        run: npm run test:db-person-model

      - name: Verify adaptive sourcing authority
        run: npm run test:db-sourcing-learning

      - name: Verify conversation and message authority
        run: npm run test:db-conversation-authority

      - name: Verify schema function privileges, workspace provisioning, and Dust authority
        run: npm run test:db-schema-authority

      - name: Verify email outbox durability
        run: npm run test:db-email-durability

      - name: Verify inbound email correlation
        run: npm run test:db-email-inbound

      - name: Verify candidate outcome events
        run: npm run test:db-email-outcomes

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify approval dispatch hashes on Postgres
        run: npm run test:db-approval-dispatch

  local-demo:
    name: Local Docker demo
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Verify the runner's installed browser
        run: google-chrome --version
      - name: Prove clean startup, login, persistence and restart
        env:
          ARIA_LOCAL_ACCEPTANCE: "1"
          ARIA_ACCEPTANCE_PROJECT: aria-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          ARIA_RELEASE_SHA: ${{ github.sha }}
          APP_PORT: "3101"
          API_PORT: "54331"
          DB_HOST_PORT: "54332"
          ARIA_BROWSER_CHANNEL: chrome
        run: npm run test:local-demo

  channel-adapters:
    name: Channel adapters
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.22"
          cache: false

      - name: Vet channel adapters
        working-directory: services/channels
        run: go vet ./...

      - name: Test channel adapters with the race detector
        working-directory: services/channels
        run: go test -race ./...

  linkedin-token-e2e:
    name: LinkedIn token Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Run the headless LinkedIn token suite
        env:
          CI: "true"
        run: bash scripts/e2e-mac.sh
      - name: Upload the end-to-end log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linkedin-token-e2e
          path: e2e-artifacts
          if-no-files-found: error

  release-gate:
    name: Release gate
    if: always()
    needs: [quality, dependency-audit, secret-scan, database-security, local-demo, channel-adapters, linkedin-token-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every CI job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          DATABASE_SECURITY_RESULT: ${{ needs.database-security.result }}
          LOCAL_DEMO_RESULT: ${{ needs.local-demo.result }}
          CHANNEL_ADAPTERS_RESULT: ${{ needs.channel-adapters.result }}
          LINKEDIN_TOKEN_E2E_RESULT: ${{ needs.linkedin-token-e2e.result }}
        run: |
          if [ "$QUALITY_RESULT" != success ] || [ "$AUDIT_RESULT" != success ] || [ "$SECRET_SCAN_RESULT" != success ] || [ "$DATABASE_SECURITY_RESULT" != success ] || [ "$LOCAL_DEMO_RESULT" != success ] || [ "$CHANNEL_ADAPTERS_RESULT" != success ] || [ "$LINKEDIN_TOKEN_E2E_RESULT" != success ]; then
            echo "::error::release gate failed: quality=$QUALITY_RESULT audit=$AUDIT_RESULT secret_scan=$SECRET_SCAN_RESULT database_security=$DATABASE_SECURITY_RESULT local_demo=$LOCAL_DEMO_RESULT channel_adapters=$CHANNEL_ADAPTERS_RESULT linkedin_token_e2e=$LINKEDIN_TOKEN_E2E_RESULT"
            exit 1
          fi
