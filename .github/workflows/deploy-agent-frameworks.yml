name: Publish ARIA agent-framework images (Fly)

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character commit SHA on the protected release branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aria-agent-frameworks-supply-chain
  cancel-in-progress: false

env:
  AF_REGISTRY_APP: aria-mantu-agent-frameworks
  AF_REGISTRY_REPOSITORY: registry.fly.io/aria-mantu-agent-frameworks
  AF_PROTECTED_REF: refs/heads/main
  AF_CERT_ISSUER: https://token.actions.githubusercontent.com
  TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f

jobs:
  validate-dispatch:
    name: Validate protected release dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AF_RELEASE_SHA: ${{ inputs.release_sha }}
      AF_WORKFLOW_REF: ${{ github.ref }}
      AF_WORKFLOW_REF_TYPE: ${{ github.ref_type }}
      AF_WORKFLOW_REF_PROTECTED: ${{ github.ref_protected }}
      AF_WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Validate release input and workflow identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AF_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::release_sha must be an exact lowercase 40-character Git SHA"
            exit 1
          }
          if [ "$AF_WORKFLOW_REF" != "$AF_PROTECTED_REF" ] \
             || [ "$AF_WORKFLOW_REF_TYPE" != "branch" ] \
             || [ "$AF_WORKFLOW_REF_PROTECTED" != "true" ]; then
            echo "::error::dispatch must execute from $AF_PROTECTED_REF"
            exit 1
          fi
          if [ "$AF_WORKFLOW_SHA" != "$AF_RELEASE_SHA" ]; then
            echo "::error::release_sha must equal the commit supplying this workflow"
            exit 1
          fi

  build-and-scan:
    name: Build and scan unsigned images
    needs: validate-dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: Production
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
      artifact-digest: ${{ steps.bundle.outputs.artifact-digest }}
    env:
      AF_RELEASE_SHA: ${{ inputs.release_sha }}
      AF_CERT_IDENTITY: https://github.com/${{ github.workflow_ref }}
      BUILDX_METADATA_PROVENANCE: max
    steps:
      - name: Checkout exact release
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize isolated Docker state
        shell: bash
        run: |
          set -euo pipefail
          isolated_home="$RUNNER_TEMP/aria-agent-framework-home"
          install -d -m 0700 "$isolated_home/.docker"
          echo "HOME=$isolated_home" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$isolated_home/.docker" >> "$GITHUB_ENV"
          echo "AF_WORK_DIR=$RUNNER_TEMP/aria-agent-framework-build" >> "$GITHUB_ENV"
          echo "AF_TRIVY_CACHE=$RUNNER_TEMP/aria-agent-framework-trivy-cache" >> "$GITHUB_ENV"

      - name: Set up pinned Docker Buildx and BuildKit
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
        with:
          version: v0.35.0
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
          cache-binary: false

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify release and pinned scanner identities
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$AF_RELEASE_SHA" ]
          test -f infra/agent-frameworks/docker-bake.hcl
          test -f infra/agent-frameworks/fly/docker-bake.hcl
          cosign verify "$TRIVY_IMAGE" \
            --certificate-identity-regexp 'https://github\.com/aquasecurity/trivy/\.github/workflows/.+' \
            --certificate-oidc-issuer "$AF_CERT_ISSUER" \
            >/dev/null

      - name: Load versioned source and runtime identities
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module >> "$GITHUB_ENV" <<'NODE'
          import { DEERFLOW_RUNTIME_IDENTITY } from "./infra/agent-frameworks/fly/operator-core.mjs";
          import {
            DEERFLOW_BUILD_IMAGE,
            DEERFLOW_RUNTIME_IMAGE,
            DEERFLOW_SOURCE_COMMIT,
            DEERFLOW_UV_IMAGE,
            DEERFLOW_UV_LOCK_SHA256,
            FLOWISE_NODE_IMAGE,
            FLOWISE_PNPM_LOCK_SHA256,
            FLOWISE_RUNTIME_IMAGE,
            FLOWISE_SOURCE_COMMIT,
            NODE_22_RUNTIME_IMAGE,
            POSTGRES_SOURCE_COMMIT,
            POSTGRES_UPSTREAM_IMAGE,
            REDIS_SOURCE_COMMIT,
            REDIS_UPSTREAM_IMAGE,
          } from "./src/lib/agents/framework/source-identity.mjs";
          const values = {
            RELEASE_SOURCE_COMMIT: process.env.AF_RELEASE_SHA,
            DEERFLOW_SOURCE_COMMIT,
            FLOWISE_SOURCE_COMMIT,
            POSTGRES_SOURCE_COMMIT,
            REDIS_SOURCE_COMMIT,
            POSTGRES_UPSTREAM_IMAGE,
            REDIS_UPSTREAM_IMAGE,
            DEERFLOW_UPSTREAM_IMAGE: DEERFLOW_RUNTIME_IMAGE,
            DEERFLOW_BUILD_IMAGE,
            DEERFLOW_UV_IMAGE,
            DEERFLOW_UV_LOCK_SHA256,
            FLOWISE_UPSTREAM_IMAGE: FLOWISE_NODE_IMAGE,
            FLOWISE_WORKER_UPSTREAM_IMAGE: FLOWISE_NODE_IMAGE,
            FLOWISE_RUNTIME_IMAGE,
            FLOWISE_PNPM_LOCK_SHA256,
            ADAPTER_UPSTREAM_IMAGE: NODE_22_RUNTIME_IMAGE,
            MODEL_GATEWAY_UPSTREAM_IMAGE: NODE_22_RUNTIME_IMAGE,
            DEERFLOW_PATCHED_RUNS_SHA256: DEERFLOW_RUNTIME_IDENTITY.patchedRunsSha256,
            DEERFLOW_CLEANUP_GUARD_SHA256: DEERFLOW_RUNTIME_IDENTITY.cleanupGuardSha256,
            DEERFLOW_RUNTIME_POLICY_SHA256: DEERFLOW_RUNTIME_IDENTITY.runtimePolicySha256,
            DEERFLOW_RUNTIME_CONFIG_SHA256: DEERFLOW_RUNTIME_IDENTITY.runtimeConfigSha256,
            DEERFLOW_DATABASE_BACKEND: DEERFLOW_RUNTIME_IDENTITY.databaseBackend,
            DEERFLOW_RUN_EVENTS_BACKEND: DEERFLOW_RUNTIME_IDENTITY.runEventsBackend,
            DEERFLOW_STREAM_BRIDGE_TYPE: DEERFLOW_RUNTIME_IDENTITY.streamBridgeType,
          };
          for (const [name, value] of Object.entries(values)) {
            if (typeof value !== "string" || !value || /[\r\n]/.test(value)) throw new Error(`${name} is invalid`);
            process.stdout.write(`${name}=${value}\n`);
          }
          NODE

      - name: Verify holder app and authenticate its registry
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_AGENT_FRAMEWORK_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          status="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $FLY_API_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.machines.dev/v1/apps/$AF_REGISTRY_APP")"
          APP_STATUS="$status" node -e '
            const value = JSON.parse(process.env.APP_STATUS);
            if (value.name !== process.env.AF_REGISTRY_APP) throw new Error("registry holder app identity mismatch");
          '
          printf '%s' "$FLY_API_TOKEN" | docker login registry.fly.io --username x --password-stdin >/dev/null

      - name: Build and push final images
        shell: bash
        env:
          GIT_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$AF_WORK_DIR"
          suffix="$AF_RELEASE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          declare -A tags=(
            [postgres]="$AF_REGISTRY_REPOSITORY:postgres-$suffix"
            [redis]="$AF_REGISTRY_REPOSITORY:redis-$suffix"
            [model-gateway]="$AF_REGISTRY_REPOSITORY:model-gateway-$suffix"
            [deerflow]="$AF_REGISTRY_REPOSITORY:deerflow-$suffix"
            [flowise]="$AF_REGISTRY_REPOSITORY:flowise-$suffix"
            [flowise-worker]="$AF_REGISTRY_REPOSITORY:flowise-worker-$suffix"
            [adapter]="$AF_REGISTRY_REPOSITORY:adapter-$suffix"
          )
          declare -A outputs=(
            [postgres]=AF_REF_POSTGRES
            [redis]=AF_REF_REDIS
            [model-gateway]=AF_REF_MODEL_GATEWAY
            [deerflow]=AF_REF_DEERFLOW
            [flowise]=AF_REF_FLOWISE
            [flowise-worker]=AF_REF_FLOWISE_WORKER
            [adapter]=AF_REF_ADAPTER
          )
          for target in postgres redis model-gateway deerflow flowise flowise-worker adapter; do
            meta="$AF_WORK_DIR/$target.metadata.json"
            docker buildx bake -f infra/agent-frameworks/fly/docker-bake.hcl "$target" \
              --set "$target.platform=linux/amd64" \
              --set "$target.tags=${tags[$target]}" \
              --push \
              --metadata-file "$meta"
            node - "$meta" "$target" "$AF_WORK_DIR/$target.provenance.json" <<'NODE'
          const fs = require("node:fs");
          const metadata = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const provenance = metadata[process.argv[3]]?.["buildx.build.provenance"];
          if (!provenance || typeof provenance !== "object" || Array.isArray(provenance)) process.exit(1);
          fs.writeFileSync(process.argv[4], `${JSON.stringify(provenance)}\n`, { mode: 0o600 });
          NODE
            digest="$(node -e '
              const metadata = require(process.argv[1]);
              const digest = metadata[process.argv[2]]?.["containerimage.digest"];
              if (!/^sha256:[0-9a-f]{64}$/.test(digest ?? "")) process.exit(1);
              process.stdout.write(digest);
            ' "$meta" "$target")"
            remote_digest="$(docker buildx imagetools inspect "${tags[$target]}" --format '{{json .Manifest}}' | node -e '
              const fs = require("node:fs");
              const value = JSON.parse(fs.readFileSync(0, "utf8"));
              if (!/^sha256:[0-9a-f]{64}$/.test(value.digest ?? "")) process.exit(1);
              process.stdout.write(value.digest);
            ')"
            [ "$remote_digest" = "$digest" ]
            echo "${outputs[$target]}=$AF_REGISTRY_REPOSITORY@$digest" >> "$GITHUB_ENV"
          done

      - name: Scan seven unique final image digests
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$AF_TRIVY_CACHE"
          scan_image() {
            local name="$1" ref="$2"
            docker run --rm \
              -v "$DOCKER_CONFIG/config.json:/root/.docker/config.json:ro" \
              -v "$AF_TRIVY_CACHE:/cache" \
              -v "$AF_WORK_DIR:/evidence" \
              "$TRIVY_IMAGE" image \
              --cache-dir /cache --timeout 20m \
              --scanners vuln,secret,misconfig \
              --severity HIGH,CRITICAL --exit-code 1 \
              --format json --output "/evidence/$name.trivy.json" "$ref"
            docker run --rm \
              -v "$DOCKER_CONFIG/config.json:/root/.docker/config.json:ro" \
              -v "$AF_TRIVY_CACHE:/cache" \
              -v "$AF_WORK_DIR:/evidence" \
              "$TRIVY_IMAGE" image \
              --cache-dir /cache --timeout 20m \
              --format spdx-json --output "/evidence/$name.spdx.json" "$ref"
            test -s "$AF_WORK_DIR/$name.trivy.json"
            test -s "$AF_WORK_DIR/$name.spdx.json"
          }
          scan_image postgres "$AF_REF_POSTGRES"
          scan_image redis "$AF_REF_REDIS"
          scan_image model-gateway "$AF_REF_MODEL_GATEWAY"
          scan_image deerflow "$AF_REF_DEERFLOW"
          scan_image flowise "$AF_REF_FLOWISE"
          scan_image flowise-worker "$AF_REF_FLOWISE_WORKER"
          scan_image adapter "$AF_REF_ADAPTER"

      - name: Create exact release evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - "$AF_WORK_DIR" <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          import {
            DEERFLOW_SOURCE_COMMIT,
            FLOWISE_SOURCE_COMMIT,
            POSTGRES_SOURCE_COMMIT,
            REDIS_SOURCE_COMMIT,
          } from "./src/lib/agents/framework/source-identity.mjs";
          const directory = process.argv[2];
          const refs = {
            postgres: process.env.AF_REF_POSTGRES,
            redis: process.env.AF_REF_REDIS,
            "model-gateway": process.env.AF_REF_MODEL_GATEWAY,
            deerflow: process.env.AF_REF_DEERFLOW,
            flowise: process.env.AF_REF_FLOWISE,
            "flowise-worker": process.env.AF_REF_FLOWISE_WORKER,
            adapter: process.env.AF_REF_ADAPTER,
          };
          const sourceCommits = {
            postgres: POSTGRES_SOURCE_COMMIT,
            redis: REDIS_SOURCE_COMMIT,
            "model-gateway": process.env.AF_RELEASE_SHA,
            deerflow: DEERFLOW_SOURCE_COMMIT,
            flowise: FLOWISE_SOURCE_COMMIT,
            "flowise-worker": FLOWISE_SOURCE_COMMIT,
            adapter: process.env.AF_RELEASE_SHA,
          };
          const upstreamImages = {
            postgres: process.env.POSTGRES_UPSTREAM_IMAGE,
            redis: process.env.REDIS_UPSTREAM_IMAGE,
            "model-gateway": process.env.MODEL_GATEWAY_UPSTREAM_IMAGE,
            deerflow: process.env.DEERFLOW_UPSTREAM_IMAGE,
            flowise: process.env.FLOWISE_UPSTREAM_IMAGE,
            "flowise-worker": process.env.FLOWISE_WORKER_UPSTREAM_IMAGE,
            adapter: process.env.ADAPTER_UPSTREAM_IMAGE,
          };
          const evidence = {};
          for (const [name, ref] of Object.entries(refs)) {
            if (!new RegExp(`^${process.env.AF_REGISTRY_REPOSITORY.replaceAll(".", "\\.")}@sha256:[0-9a-f]{64}$`).test(ref ?? "")) {
              throw new Error(`${name} image reference is invalid`);
            }
            evidence[name] = {};
            for (const kind of ["trivy", "spdx", "provenance", "metadata"]) {
              const file = `${name}.${kind}.json`;
              const bytes = fs.readFileSync(path.join(directory, file));
              if (bytes.length < 2) throw new Error(`${file} is empty`);
              JSON.parse(bytes);
              evidence[name][kind] = { file, sha256: createHash("sha256").update(bytes).digest("hex") };
            }
          }
          const bundle = {
            schema: "aria.agent-framework.image-release.v1",
            releaseSha: process.env.AF_RELEASE_SHA,
            repository: process.env.AF_REGISTRY_REPOSITORY,
            certificateIdentity: process.env.AF_CERT_IDENTITY,
            certificateIssuer: process.env.AF_CERT_ISSUER,
            refs,
            sourceCommits,
            upstreamImages,
            evidence,
          };
          fs.writeFileSync(path.join(directory, "release-bundle.json"), `${JSON.stringify(bundle, null, 2)}\n`, { mode: 0o600 });
          NODE

      - name: Upload unsigned evidence bundle
        id: bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aria-agent-framework-build-${{ inputs.release_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aria-agent-framework-build
          if-no-files-found: error
          retention-days: 30

      - name: Remove registry credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${DOCKER_CONFIG:-}" ]; then
            case "$DOCKER_CONFIG" in
              "$RUNNER_TEMP"/*) docker logout registry.fly.io >/dev/null 2>&1 || true; rm -f -- "$DOCKER_CONFIG/config.json" ;;
              *) echo "::error::unexpected Docker config path"; exit 1 ;;
            esac
          fi

  sign-verify-and-pin:
    name: Sign, verify, and pin final images
    needs: [validate-dispatch, build-and-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: Production
    permissions:
      contents: read
      id-token: write
    env:
      AF_RELEASE_SHA: ${{ inputs.release_sha }}
      AF_CERT_IDENTITY: https://github.com/${{ github.workflow_ref }}
      AF_BUILD_ARTIFACT_DIGEST: ${{ needs.build-and-scan.outputs.artifact-digest }}
    steps:
      - name: Checkout exact release
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize isolated verification state
        shell: bash
        run: |
          set -euo pipefail
          isolated_home="$RUNNER_TEMP/aria-agent-framework-sign-home"
          install -d -m 0700 "$isolated_home/.docker" "$RUNNER_TEMP/aria-agent-framework-trivy-cache"
          echo "HOME=$isolated_home" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$isolated_home/.docker" >> "$GITHUB_ENV"
          echo "AF_WORK_DIR=$RUNNER_TEMP/aria-agent-framework-build" >> "$GITHUB_ENV"
          echo "AF_TRIVY_CACHE=$RUNNER_TEMP/aria-agent-framework-trivy-cache" >> "$GITHUB_ENV"

      - name: Download exact build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-and-scan.outputs.artifact-id }}
          path: ${{ runner.temp }}/aria-agent-framework-build

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify scanner identity and authenticate holder registry
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_AGENT_FRAMEWORK_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          cosign verify "$TRIVY_IMAGE" \
            --certificate-identity-regexp 'https://github\.com/aquasecurity/trivy/\.github/workflows/.+' \
            --certificate-oidc-issuer "$AF_CERT_ISSUER" \
            >/dev/null
          printf '%s' "$FLY_API_TOKEN" | docker login registry.fly.io --username x --password-stdin >/dev/null

      - name: Validate unsigned bundle before granting signing authority
        shell: bash
        run: |
          set -euo pipefail
          node infra/agent-frameworks/fly/release-bundle.mjs validate \
            --directory "$AF_WORK_DIR" \
            --release-sha "$AF_RELEASE_SHA" \
            --repository "$AF_REGISTRY_REPOSITORY" \
            --certificate-identity "$AF_CERT_IDENTITY" \
            --certificate-issuer "$AF_CERT_ISSUER"

      - name: Sign and attest seven unique final digests
        shell: bash
        run: |
          set -euo pipefail
          node - "$AF_WORK_DIR/release-bundle.json" > "$RUNNER_TEMP/aria-agent-framework-rows" <<'NODE'
          const bundle = require(process.argv[2]);
          for (const name of Object.keys(bundle.refs).sort()) {
            process.stdout.write([name, bundle.refs[name], bundle.evidence[name].spdx.file, bundle.evidence[name].provenance.file].join("\t") + "\n");
          }
          NODE
          while IFS=$'\t' read -r name ref sbom provenance; do
            cosign sign --yes "$ref"
            cosign attest --yes --type spdxjson --predicate "$AF_WORK_DIR/$sbom" "$ref"
            cosign attest --yes --type slsaprovenance --predicate "$AF_WORK_DIR/$provenance" "$ref"
          done < "$RUNNER_TEMP/aria-agent-framework-rows"

      - name: Emit ten-role operator image block
        shell: bash
        run: |
          set -euo pipefail
          node infra/agent-frameworks/fly/release-bundle.mjs manifest \
            --directory "$AF_WORK_DIR" \
            --output "$AF_WORK_DIR/manifest-images.json"

      - name: Validate signed evidence with the production operator
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/aria-agent-framework-bin"
          install -d -m 0700 "$bin"
          cat > "$bin/trivy" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          [ "${1:-}" = "image" ] || { echo "unsupported Trivy command" >&2; exit 64; }
          shift
          exec docker run --rm \
            -v "$DOCKER_CONFIG/config.json:/root/.docker/config.json:ro" \
            -v "$AF_TRIVY_CACHE:/cache" \
            "$TRIVY_IMAGE" image --cache-dir /cache "$@"
          SH
          chmod 0700 "$bin/trivy"
          PATH="$bin:$PATH" node --input-type=module - "$AF_WORK_DIR/manifest-images.json" "$AF_WORK_DIR/operator-evidence.json" <<'NODE'
          import fs from "node:fs";
          import { DEERFLOW_RUNTIME_IDENTITY } from "./infra/agent-frameworks/fly/operator-core.mjs";
          import { runCommand, verifySupplyChainForImage } from "./infra/agent-frameworks/fly/operator.mjs";
          const document = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const uniqueRoles = ["flowise-db", "flowise-redis", "model-gateway", "deerflow", "flowise", "flowise-worker", "deerflow-adapter"];
          const aliases = {
            "deerflow-db": "flowise-db",
            "deerflow-redis": "flowise-redis",
            "flowise-adapter": "deerflow-adapter",
          };
          const evidence = {};
          for (const role of uniqueRoles) {
            evidence[role] = await verifySupplyChainForImage(
              role,
              document.images[role],
              runCommand,
              role === "deerflow" ? DEERFLOW_RUNTIME_IDENTITY : undefined,
              process.env.AF_RELEASE_SHA,
            );
          }
          for (const [role, authority] of Object.entries(aliases)) evidence[role] = evidence[authority];
          fs.writeFileSync(process.argv[3], `${JSON.stringify(evidence, null, 2)}\n`, { mode: 0o600 });
          NODE

      - name: Pin signed digests to stopped holder Machines
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_AGENT_FRAMEWORK_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          node infra/agent-frameworks/fly/pin-registry-images.mjs \
            --bundle "$AF_WORK_DIR/release-bundle.json" \
            --app "$AF_REGISTRY_APP" \
            --region cdg

      - name: Archive signed and verified evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aria-agent-framework-signed-${{ inputs.release_sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aria-agent-framework-build/release-bundle.json
            ${{ runner.temp }}/aria-agent-framework-build/manifest-images.json
            ${{ runner.temp }}/aria-agent-framework-build/operator-evidence.json
            ${{ runner.temp }}/aria-agent-framework-build/*.trivy.json
            ${{ runner.temp }}/aria-agent-framework-build/*.spdx.json
            ${{ runner.temp }}/aria-agent-framework-build/*.provenance.json
            ${{ runner.temp }}/aria-agent-framework-build/*.metadata.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove registry credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${DOCKER_CONFIG:-}" ]; then
            case "$DOCKER_CONFIG" in
              "$RUNNER_TEMP"/*) docker logout registry.fly.io >/dev/null 2>&1 || true; rm -f -- "$DOCKER_CONFIG/config.json" ;;
              *) echo "::error::unexpected Docker config path"; exit 1 ;;
            esac
          fi
