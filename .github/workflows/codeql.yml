name: CodeQL

on:
  # Push analysis is limited to the long-lived integration branches; feature
  # branches are analyzed via the pull_request event. This avoids the
  # duplicate push + PR runs that doubled Actions minutes usage per commit.
  push:
    branches: ["vercel-demo", "main", "master"]
  pull_request:
    branches: ["**"]
  schedule:
    # Run weekly on Monday at 03:17 UTC so results don't pile up unnoticed
    - cron: "17 3 * * 1"

# Cancel superseded analyses for the same ref to conserve Actions minutes.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
