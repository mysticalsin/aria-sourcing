name: Interviewer hand-off

on:
  push:
    paths:
      - "go/interviewer/**"
      - "src/lib/interviewer-flag.ts"
      - "tests/interviewer-flag.mts"
      - ".github/workflows/interviewer.yml"
  pull_request:
    paths:
      - "go/interviewer/**"
      - "src/lib/interviewer-flag.ts"
      - "tests/interviewer-flag.mts"
      - ".github/workflows/interviewer.yml"

permissions:
  contents: read

jobs:
  test:
    name: Flag-off adapter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.22"
          cache: false

      - name: Test the adapter with a fake server
        working-directory: go/interviewer
        run: go test ./...
