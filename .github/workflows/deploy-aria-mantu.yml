          sbom-path: ${{ runner.temp }}/aria-release-supply-chain/aria-kong.cdx.json

      - name: Attest Graphify worker build provenance
        id: attest_graphify_provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: registry.fly.io/aria-graphify-lessons
          subject-digest: ${{ env.ARIA_GRAPHIFY_IMAGE_DIGEST }}

      - name: Attest Graphify worker SBOM
        id: attest_graphify_sbom
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: registry.fly.io/aria-graphify-lessons
          subject-digest: ${{ env.ARIA_GRAPHIFY_IMAGE_DIGEST }}
          sbom-path: ${{ runner.temp }}/aria-release-supply-chain/aria-graphify.cdx.json

      - name: Collect signed attestation bundles
        shell: bash
        env:
          APP_PROVENANCE: ${{ steps.attest_app_provenance.outputs.bundle-path }}
          APP_SBOM: ${{ steps.attest_app_sbom.outputs.bundle-path }}
          DB_PROVENANCE: ${{ steps.attest_db_provenance.outputs.bundle-path }}
          DB_SBOM: ${{ steps.attest_db_sbom.outputs.bundle-path }}
          BOOTSTRAP_PROVENANCE: ${{ steps.attest_bootstrap_provenance.outputs.bundle-path }}
          BOOTSTRAP_SBOM: ${{ steps.attest_bootstrap_sbom.outputs.bundle-path }}
          KONG_PROVENANCE: ${{ steps.attest_kong_provenance.outputs.bundle-path }}
          KONG_SBOM: ${{ steps.attest_kong_sbom.outputs.bundle-path }}
          GRAPHIFY_PROVENANCE: ${{ steps.attest_graphify_provenance.outputs.bundle-path }}
          GRAPHIFY_SBOM: ${{ steps.attest_graphify_sbom.outputs.bundle-path }}
          APP_PROVENANCE_ID: ${{ steps.attest_app_provenance.outputs.attestation-id }}
          APP_SBOM_ID: ${{ steps.attest_app_sbom.outputs.attestation-id }}
          DB_PROVENANCE_ID: ${{ steps.attest_db_provenance.outputs.attestation-id }}
          DB_SBOM_ID: ${{ steps.attest_db_sbom.outputs.attestation-id }}
          BOOTSTRAP_PROVENANCE_ID: ${{ steps.attest_bootstrap_provenance.outputs.attestation-id }}
          BOOTSTRAP_SBOM_ID: ${{ steps.attest_bootstrap_sbom.outputs.attestation-id }}
          KONG_PROVENANCE_ID: ${{ steps.attest_kong_provenance.outputs.attestation-id }}
          KONG_SBOM_ID: ${{ steps.attest_kong_sbom.outputs.attestation-id }}
          GRAPHIFY_PROVENANCE_ID: ${{ steps.attest_graphify_provenance.outputs.attestation-id }}
          GRAPHIFY_SBOM_ID: ${{ steps.attest_graphify_sbom.outputs.attestation-id }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/aria-release-supply-chain"
          for specification in \
            "app-provenance|$APP_PROVENANCE" \
            "app-sbom|$APP_SBOM" \
            "db-provenance|$DB_PROVENANCE" \
            "db-sbom|$DB_SBOM" \
            "bootstrap-provenance|$BOOTSTRAP_PROVENANCE" \
            "bootstrap-sbom|$BOOTSTRAP_SBOM" \
            "kong-provenance|$KONG_PROVENANCE" \
            "kong-sbom|$KONG_SBOM" \
            "graphify-provenance|$GRAPHIFY_PROVENANCE" \
            "graphify-sbom|$GRAPHIFY_SBOM"
          do
            IFS='|' read -r name source <<< "$specification"
            test -s "$source"
            cp "$source" "$evidence/aria-$name.sigstore.json"
          done
          printf '%s\t%s\t%s\n' \
            app "$APP_PROVENANCE_ID" "$APP_SBOM_ID" \
            db "$DB_PROVENANCE_ID" "$DB_SBOM_ID" \
            bootstrap "$BOOTSTRAP_PROVENANCE_ID" "$BOOTSTRAP_SBOM_ID" \
            kong "$KONG_PROVENANCE_ID" "$KONG_SBOM_ID" \
            graphify "$GRAPHIFY_PROVENANCE_ID" "$GRAPHIFY_SBOM_ID" \
            > "$evidence/attestation-ids.tsv"

          export ARIA_RELEASE_EVIDENCE_DIR="$evidence"
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const evidence = process.env.ARIA_RELEASE_EVIDENCE_DIR;
          const workspace = process.env.GITHUB_WORKSPACE;
          const sha256 = (file) => crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          const rows = (file) => fs.readFileSync(path.join(evidence, file), "utf8")
            .trim().split("\n").filter(Boolean).map((line) => line.split("\t"));
          const promoted = Object.fromEntries(rows("promoted-images.tsv"));
          const candidates = Object.fromEntries(rows("candidate-images.tsv").map(([component, , image]) => [component, image]));
          const attestations = Object.fromEntries(rows("attestation-ids.tsv").map(([component, provenance, sbom]) => [component, { provenance, sbom }]));
          const upstream = Object.fromEntries(rows("upstream-images.tsv").map(([component, repository, image]) => [component, { repository, image }]));
          const dockerfiles = {
            app: "Dockerfile.prod",
            db: "docker/db/Dockerfile.fly",
            bootstrap: "docker/bootstrap/Dockerfile.fly",
            kong: "docker/kong/Dockerfile.fly",
            graphify: "workers/graphify-lessons/Dockerfile",
          };
          const components = Object.fromEntries(Object.keys(dockerfiles).map((component) => {
            const files = [
              `aria-${component}.cdx.json`,
              `aria-${component}-vulnerabilities.json`,
              `aria-${component}-secrets.json`,
              `aria-${component}-artifacts.sha256`,
              `aria-${component}-provenance.sigstore.json`,
              `aria-${component}-sbom.sigstore.json`,
            ];
            return [component, {
              candidateImage: candidates[component],
              promotedImage: promoted[component],
              dockerfile: dockerfiles[component],
              dockerfileSha256: sha256(path.join(workspace, dockerfiles[component])),
              attestations: attestations[component],
              evidence: Object.fromEntries(files.map((file) => [file, sha256(path.join(evidence, file))])),
            }];
          }));
          const upstreamComponents = Object.fromEntries(Object.entries(upstream).map(([component, authority]) => {
            const files = [
              `aria-${component}.cdx.json`,
              `aria-${component}-vulnerabilities.json`,
              `aria-${component}-secrets.json`,
              `aria-${component}-artifacts.sha256`,
            ];
            return [component, {
              ...authority,
              provenance: "upstream-digest-pinned-runtime",
              evidence: Object.fromEntries(files.map((file) => [file, sha256(path.join(evidence, file))])),
            }];
          }));
          const manifest = {
            schemaVersion: 1,
            releaseSha: process.env.ARIA_RELEASE_SHA,
            platform: "linux/amd64",
            scanner: process.env.TRIVY_IMAGE,
            sbomValidator: process.env.CYCLONEDX_CLI_IMAGE,
            components,
            upstreamComponents,
          };
          fs.writeFileSync(path.join(evidence, "aria-release-manifest.json"), `${JSON.stringify(manifest, null, 2)}\n`, { mode: 0o600 });
          NODE

      - name: Refresh recovery state immediately before production mutation
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_RECOVERY_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          receipt="$RUNNER_TEMP/aria-volume-recovery-receipt.json"
          restore_request="$RUNNER_TEMP/aria-volume-restore-create-request.json"
          restore_response="$RUNNER_TEMP/aria-volume-restore-create-response.json"
          volumes="$RUNNER_TEMP/aria-volume-recovery-volumes.json"
          snapshots="$RUNNER_TEMP/aria-volume-recovery-snapshots.json"
          restore_volumes="$RUNNER_TEMP/aria-volume-recovery-restore-volumes.json"
          source_machines="$RUNNER_TEMP/aria-volume-recovery-source-machines.json"
          restore_machines="$RUNNER_TEMP/aria-volume-recovery-restore-machines.json"
          source_ips="$RUNNER_TEMP/aria-volume-recovery-source-ips.json"
          restore_ips="$RUNNER_TEMP/aria-volume-recovery-restore-ips.json"
          actual_receipt_sha256="$(sha256sum "$receipt" | awk '{print $1}')"
          [ "$actual_receipt_sha256" = "$ARIA_RECOVERY_RECEIPT_SHA256" ] || {
            echo "::error::recovery receipt changed after initial validation"
            exit 1
          }
          readarray -t recovery_identity < <(node -e '
            const fs = require("node:fs");
            const receipt = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const volume = receipt?.production?.volumeId;
            const app = receipt?.restoreDrill?.targetApp;
            if (!/^vol_[A-Za-z0-9]+$/.test(volume ?? "")) process.exit(1);
            if (!/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(app ?? "")) process.exit(1);
            process.stdout.write(`${volume}\n${app}\n`);
          ' "$receipt")
          [ "${#recovery_identity[@]}" -eq 2 ]
          volume_id="${recovery_identity[0]}"
          restore_app="${recovery_identity[1]}"
          flyctl volumes list --app aria-mantu-db --json > "$volumes"
          flyctl volumes snapshots list "$volume_id" --app aria-mantu-db --json > "$snapshots"
          flyctl volumes list --app "$restore_app" --json > "$restore_volumes"
          flyctl machines list --app aria-mantu-db --json > "$source_machines"
          flyctl machines list --app "$restore_app" --json > "$restore_machines"
          flyctl ips list --app aria-mantu-db --json > "$source_ips"
          flyctl ips list --app "$restore_app" --json > "$restore_ips"
          node scripts/validate-volume-recovery-receipt.mjs \
            "$receipt" "$volumes" "$snapshots" "$restore_volumes" \
            "$source_ips" "$restore_ips" "$restore_request" "$restore_response" \
            "$source_machines" "$restore_machines" "$ARIA_RELEASE_SHA"

