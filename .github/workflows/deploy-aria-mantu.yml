name: Deploy Aria Mantu (Fly)

# Runs the full Fly deploy from a GitHub runner (clean, fast network to Fly) so it
# does not depend on any local machine's route to Fly's API. Triggers on push to the
# deploy branch (git push works even when the GitHub API is unreachable locally).
on:
  push:
    branches: [deploy/fly-github-actions]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Restore secret files from bundle
        env:
          BUNDLE: ${{ secrets.ARIA_DEPLOY_BUNDLE }}
        run: |
          if [ -z "$BUNDLE" ]; then echo "::error::ARIA_DEPLOY_BUNDLE secret is not set"; exit 1; fi
          # strip whitespace/newlines (macOS base64 wraps) then decode to a file, then untar
          printf '%s' "$BUNDLE" | tr -d '[:space:]' | base64 -d > /tmp/ab.tgz
          tar xzf /tmp/ab.tgz -C .
          echo "restored:"; ls -1 production-readiness/.fly-*.env .env.local 2>/dev/null

      - name: Deploy the full Fly stack
        run: |
          # install flyctl directly (creates BOTH `flyctl` and `fly`) and put it on PATH
          # in THIS step, so deploy-fly.sh (which calls `fly`) finds it.
          curl -L https://fly.io/install.sh | sh
          export PATH="$HOME/.fly/bin:$PATH"
          fly version
          bash deploy-fly.sh

      - name: Verify the app is actually live
        run: |
          echo "App:  https://aria-mantu-app.fly.dev"
          echo "Kong: https://aria-mantu-kong.fly.dev"
          for i in $(seq 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://aria-mantu-app.fly.dev/api/health || echo 000)
            echo "attempt $i: app /api/health -> $code"
            [ "$code" = "200" ] && { echo "APP IS LIVE"; exit 0; }
            sleep 15
          done
          echo "::error::app did not become healthy after deploy"; exit 1
