          FLOWISE_SOURCE_COMMIT: bb773ffa710bd22639c4ba2643413a0ea2b679d3
          FLOWISE_IMAGE_DIGEST: ${{ vars.ARIA_FLOWISE_IMAGE_DIGEST }}
          FLOWISE_WORKER_IMAGE_DIGEST: ${{ vars.ARIA_FLOWISE_WORKER_IMAGE_DIGEST }}
          FLOWISE_DATABASE_IMAGE_DIGEST: ${{ vars.ARIA_FLOWISE_DATABASE_IMAGE_DIGEST }}
          FLOWISE_FRAMEWORK_INSTANCE_ID: ${{ vars.ARIA_FLOWISE_INSTANCE_ID }}
          FLOWISE_WORKSPACE_ID: ${{ vars.ARIA_FLOWISE_WORKSPACE_ID }}
          FLOWISE_READINESS_WORKFLOW_ID: ${{ vars.ARIA_FLOWISE_READINESS_WORKFLOW_ID }}
          FLOWISE_TENANT_ISOLATION: instance-per-workspace
          FLOWISE_QUEUE_NAME: aria-flowise
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GITHUB_SOURCE_TOKEN: ${{ secrets.ARIA_GITHUB_SOURCE_TOKEN }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const values = [
            process.env.FLY_PG_PASSWORD,
            process.env.FLY_SUPABASE_ADMIN_CURRENT_PASSWORD,
            process.env.FLY_SUPABASE_ADMIN_TARGET_PASSWORD,
            process.env.FLY_AUTH_DB_PASSWORD,
            process.env.FLY_REST_DB_PASSWORD,
            process.env.FLY_AGENT_FRAMEWORK_CAPABILITY_SECRET,
            process.env.FLY_DEERFLOW_ADAPTER_TOKEN,
            process.env.FLY_FLOWISE_ADAPTER_TOKEN,
          ].filter(Boolean);
          for (const value of values) {
            console.log(`::add-mask::${value}`);
            console.log(`::add-mask::${encodeURIComponent(value)}`);
          }
          const host = "aria-mantu-db.internal:5432/postgres";
          if (process.env.FLY_AUTH_DB_PASSWORD) {
            console.log(`::add-mask::postgres://supabase_auth_admin:${encodeURIComponent(process.env.FLY_AUTH_DB_PASSWORD)}@${host}`);
          }
          if (process.env.FLY_REST_DB_PASSWORD) {
            console.log(`::add-mask::postgres://authenticator:${encodeURIComponent(process.env.FLY_REST_DB_PASSWORD)}@${host}`);
          }
          NODE
          flyctl version
          bash deploy-fly.sh

      - name: Verify tenant administrator gate
        shell: bash
        env:
          KONG_URL: https://aria-mantu-kong.fly.dev
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FLY_SUPABASE_SERVICE_KEY }}
          ANON_KEY: ${{ secrets.FLY_SUPABASE_ANON_KEY }}
          ARIA_ALLOWED_EMAIL_DOMAIN: ${{ vars.ARIA_ALLOWED_EMAIL_DOMAIN }}
          ARIA_ADMIN_BOOTSTRAP_APPROVAL: ${{ vars.ARIA_ADMIN_BOOTSTRAP_APPROVAL }}
          ARIA_FIRST_ADMIN_EMAIL: ${{ secrets.ARIA_FIRST_ADMIN_EMAIL }}
          ARIA_FIRST_ADMIN_PASSWORD: ${{ secrets.ARIA_FIRST_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          deployment_receipt="$RUNNER_TEMP/aria-deployment-receipt.json"
          verification_receipt="$RUNNER_TEMP/aria-tenant-admin-verification.json"
          admin_response=""
          admin_config=""
          admin_candidate_ids=""
          admin_user_response=""
          admin_user_config=""
          cleanup_admin_gate() {
            [ -z "$admin_response" ] || rm -f -- "$admin_response"
            [ -z "$admin_config" ] || rm -f -- "$admin_config"
            [ -z "$admin_candidate_ids" ] || rm -f -- "$admin_candidate_ids"
            [ -z "$admin_user_response" ] || rm -f -- "$admin_user_response"
            [ -z "$admin_user_config" ] || rm -f -- "$admin_user_config"
            unset SUPABASE_SERVICE_ROLE_KEY ANON_KEY ARIA_ADMIN_BOOTSTRAP_APPROVAL ARIA_FIRST_ADMIN_EMAIL ARIA_FIRST_ADMIN_PASSWORD
          }
          trap cleanup_admin_gate EXIT HUP INT TERM
          test -s "$deployment_receipt"
          node scripts/validate-email-domain.mjs "$ARIA_ALLOWED_EMAIL_DOMAIN"
          printf '::add-mask::%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
          printf '::add-mask::%s\n' "$ANON_KEY"
          [ -z "$ARIA_FIRST_ADMIN_EMAIL" ] || printf '::add-mask::%s\n' "$ARIA_FIRST_ADMIN_EMAIL"
          [ -z "$ARIA_FIRST_ADMIN_PASSWORD" ] || printf '::add-mask::%s\n' "$ARIA_FIRST_ADMIN_PASSWORD"

          deployment_mode="$(node -e '
            const fs = require("node:fs");
            const receipt = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (
              receipt.schemaVersion !== 2 ||
              receipt.releaseSha !== process.env.ARIA_RELEASE_SHA ||
              receipt.status !== "pending-application-acceptance" ||
              !["owner-approved-first-deploy", "existing-release"].includes(receipt.deploymentMode)
            ) process.exit(1);
            process.stdout.write(receipt.deploymentMode);
          ' "$deployment_receipt")"

          admin_response="$RUNNER_TEMP/aria-existing-admins.json"
          admin_config="$RUNNER_TEMP/aria-existing-admins.curl"
          admin_candidate_ids="$RUNNER_TEMP/aria-existing-admin-ids.txt"
          admin_user_response="$RUNNER_TEMP/aria-existing-admin-user.json"
          admin_user_config="$RUNNER_TEMP/aria-existing-admin-user.curl"

          inventory_real_admin() {
            local expected_email="${1:-}"
            local admin_code candidate_id admin_user_code
            {
              printf 'silent\nshow-error\nconnect-timeout = 10\nmax-time = 30\n'
              printf 'request = "GET"\n'
              printf 'url = "%s/rest/v1/profiles?role=eq.admin&select=id,role,workspace_id,workspaces!inner(id,allowed_domain)&workspaces.allowed_domain=eq.%s"\n' "$KONG_URL" "$ARIA_ALLOWED_EMAIL_DOMAIN"
              printf 'header = "apikey: %s"\n' "$SUPABASE_SERVICE_ROLE_KEY"
              printf 'header = "Authorization: Bearer %s"\n' "$SUPABASE_SERVICE_ROLE_KEY"
              printf 'output = "%s"\n' "$admin_response"
              printf 'write-out = "%%{http_code}"\n'
            } > "$admin_config"
            admin_code="$(curl --config "$admin_config")"
            [ "$admin_code" = 200 ]
            node -e '
              const fs = require("node:fs");
              const domain = process.argv[2];
              const rows = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (!Array.isArray(rows)) process.exit(1);
              const ids = [];
              const seen = new Set();
              for (const row of rows) {
                const workspace = row?.workspaces;
                if (
                  row?.role !== "admin" ||
                  typeof row?.id !== "string" ||
                  !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(row.id) ||
                  !workspace || typeof workspace !== "object" || Array.isArray(workspace) ||
                  workspace.id !== row.workspace_id || workspace.allowed_domain !== domain ||
                  seen.has(row.id)
                ) process.exit(1);
                seen.add(row.id);
                ids.push(row.id);
              }
              process.stdout.write(ids.length ? `${ids.join("\n")}\n` : "");
            ' "$admin_response" "$ARIA_ALLOWED_EMAIL_DOMAIN" > "$admin_candidate_ids"

            admin_state=absent
            while IFS= read -r candidate_id; do
              [ -n "$candidate_id" ] || continue
              {
                printf 'silent\nshow-error\nconnect-timeout = 10\nmax-time = 30\n'
                printf 'request = "GET"\n'
                printf 'url = "%s/auth/v1/admin/users/%s"\n' "$KONG_URL" "$candidate_id"
                printf 'header = "apikey: %s"\n' "$SUPABASE_SERVICE_ROLE_KEY"
                printf 'header = "Authorization: Bearer %s"\n' "$SUPABASE_SERVICE_ROLE_KEY"
                printf 'output = "%s"\n' "$admin_user_response"
                printf 'write-out = "%%{http_code}"\n'
              } > "$admin_user_config"
              admin_user_code="$(curl --config "$admin_user_config")"
              [ "$admin_user_code" = 200 ]
              if node -e '
                const fs = require("node:fs");
                const expectedId = process.argv[2];
                const domain = process.argv[3];
                const expectedEmail = process.argv[4].toLowerCase();
                const user = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                if (user?.id !== expectedId || typeof user?.email !== "string") process.exit(1);
                const email = user.email.toLowerCase();
                const [local, emailDomain, ...extra] = email.split("@");
                const providers = new Set([
                  ...(Array.isArray(user.app_metadata?.providers) ? user.app_metadata.providers : []),
                  user.app_metadata?.provider,
                  ...(Array.isArray(user.identities) ? user.identities.map((identity) => identity?.provider) : []),
                ].filter((value) => typeof value === "string"));
                const confirmedAt = Date.parse(user.email_confirmed_at ?? user.confirmed_at ?? "");
                const lastSignInAt = Date.parse(user.last_sign_in_at ?? "");
                const bannedUntil = user.banned_until ? Date.parse(user.banned_until) : Number.NaN;
                if (
                  !local || extra.length !== 0 || emailDomain !== domain || local.startsWith("aria.acceptance+") ||
                  (expectedEmail && email !== expectedEmail) || !providers.has("email") ||
                  !Number.isFinite(confirmedAt) || !Number.isFinite(lastSignInAt) ||
                  user.deleted_at || user.user_metadata?.aria_acceptance_marker ||
                  (user.banned_until && (!Number.isFinite(bannedUntil) || bannedUntil > Date.now()))
                ) process.exit(1);
              ' "$admin_user_response" "$candidate_id" "$ARIA_ALLOWED_EMAIL_DOMAIN" "$expected_email"; then
                admin_state=present
                break
              fi
            done < "$admin_candidate_ids"
          }

          inventory_real_admin

          if [ "$admin_state" = present ]; then
            [ -z "$ARIA_ADMIN_BOOTSTRAP_APPROVAL" ]
            [ -z "$ARIA_FIRST_ADMIN_EMAIL" ]
            [ -z "$ARIA_FIRST_ADMIN_PASSWORD" ]
            verification_mode=existing-admin-verified
          else
            [ "$admin_state" = absent ]
            expected_bootstrap_approval="aria-admin-bootstrap-v1:${ARIA_RELEASE_SHA}:${ARIA_RECOVERY_RECEIPT_SHA256}"
            [ "$ARIA_ADMIN_BOOTSTRAP_APPROVAL" = "$expected_bootstrap_approval" ]
            test -n "$ARIA_FIRST_ADMIN_EMAIL"
            test -n "$ARIA_FIRST_ADMIN_PASSWORD"
            ADMIN_EMAIL="$ARIA_FIRST_ADMIN_EMAIL" \
            ADMIN_PASSWORD="$ARIA_FIRST_ADMIN_PASSWORD" \
            ARIA_RELEASE_SHA="$ARIA_RELEASE_SHA" \
            ARIA_RECOVERY_RECEIPT_SHA256="$ARIA_RECOVERY_RECEIPT_SHA256" \
            ARIA_ADMIN_BOOTSTRAP_APPROVAL="$ARIA_ADMIN_BOOTSTRAP_APPROVAL" \
            bash scripts/provision-first-admin.sh >/dev/null
            inventory_real_admin "$ARIA_FIRST_ADMIN_EMAIL"
            [ "$admin_state" = present ]
            verification_mode=protected-admin-bootstrap
          fi

          export deployment_mode verification_mode verification_receipt
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const bootstrapApprovalSha256 = process.env.verification_mode === "protected-admin-bootstrap"
            ? crypto.createHash("sha256").update(process.env.ARIA_ADMIN_BOOTSTRAP_APPROVAL, "utf8").digest("hex")
            : null;
          const receipt = {
            schemaVersion: 1,
            releaseSha: process.env.ARIA_RELEASE_SHA,
            recoveryReceiptSha256: process.env.ARIA_RECOVERY_RECEIPT_SHA256,
            status: "passed",
            deploymentMode: process.env.deployment_mode,
            verificationMode: process.env.verification_mode,
            adminBootstrapApprovalSha256: bootstrapApprovalSha256,
            identityProof: "gotrue-active-email-provider-last-sign-in+profile-workspace-domain",
            realTenantAdminVerified: true,
            verifiedAt: new Date().toISOString(),
          };
          fs.writeFileSync(process.env.verification_receipt, `${JSON.stringify(receipt, null, 2)}\n`, { mode: 0o600 });
          NODE
          cleanup_admin_gate
          trap - EXIT HUP INT TERM

      - name: Run isolated authenticated campaign acceptance
        shell: bash
        env:
          APP_URL: https://aria-mantu-app.fly.dev
          KONG_URL: https://aria-mantu-kong.fly.dev
          ANON_KEY: ${{ secrets.FLY_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FLY_SUPABASE_SERVICE_KEY }}
          ARIA_ALLOWED_EMAIL_DOMAIN: ${{ vars.ARIA_ALLOWED_EMAIL_DOMAIN }}
          ARIA_ACCEPTANCE_RECEIPT_PATH: ${{ runner.temp }}/aria-application-acceptance.json
        run: |
          set -euo pipefail
          umask 077
          receipt_pending="$ARIA_ACCEPTANCE_RECEIPT_PATH.pending"
          rm -f "$receipt_pending" "$ARIA_ACCEPTANCE_RECEIPT_PATH"
          bash scripts/acceptance-campaign-dry-run.sh > "$receipt_pending"
          node -e '
            const fs = require("node:fs");
            const receipt = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (
              receipt.schemaVersion !== 1 ||
              receipt.releaseSha !== process.env.ARIA_RELEASE_SHA ||
              receipt.status !== "passed" ||
              receipt.checks?.authenticatedWorkspaceBinding !== true ||
              receipt.checks?.authenticatedStateReload !== true ||
              receipt.checks?.outreachLedgerRows !== 0 ||
              receipt.checks?.messagesOutboundRows !== 0 ||
              receipt.checks?.cleanupVerified !== true ||
              receipt.safety?.syntheticDataOnly !== true ||
              receipt.safety?.liveSendIntentProvided !== false ||
              receipt.safety?.requestsWithConfirmLiveTrue !== 0 ||
              receipt.safety?.providerCallPreventionProof !== "exact-sha-ci-normal-tenant-route-counters"
            ) process.exit(1);
          ' "$receipt_pending"
          mv "$receipt_pending" "$ARIA_ACCEPTANCE_RECEIPT_PATH"
          chmod 0600 "$ARIA_ACCEPTANCE_RECEIPT_PATH"

      - name: Destroy the disposable recovery target
        if: always()
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_RECOVERY_CLEANUP_TOKEN }}
        run: |
          set -euo pipefail
          cleanup_target="$RUNNER_TEMP/aria-volume-recovery-cleanup-target.json"
          cleanup="$RUNNER_TEMP/aria-volume-recovery-cleanup.json"
          apps_after="$RUNNER_TEMP/aria-volume-recovery-apps-after-cleanup.json"
          if [ ! -s "$cleanup_target" ]; then
            echo "No validated disposable recovery target is available for cleanup."
            exit 0
          fi
          test -n "$FLY_API_TOKEN"
          readarray -t target < <(node -e '
            const fs = require("node:fs");
            const target = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const expectedApp = `aria-mantu-db-recovery-${process.env.ARIA_RELEASE_SHA.slice(0, 12)}`;
            const keys = Object.keys(target).sort().join(",");
            if (
              keys !== "app,machineId,receiptSha256,releaseSha,schemaVersion,volumeId" ||
              target.schemaVersion !== 1 ||
              target.releaseSha !== process.env.ARIA_RELEASE_SHA ||
              target.receiptSha256 !== process.env.ARIA_RECOVERY_RECEIPT_SHA256 ||
              target.app !== expectedApp ||
              !/^vol_[A-Za-z0-9]+$/.test(target.volumeId ?? "") ||
              !/^[0-9a-f]{14}$/.test(target.machineId ?? "")
            ) process.exit(1);
            process.stdout.write(`${target.app}\n${target.volumeId}\n${target.machineId}\n`);
          ' "$cleanup_target")
          [ "${#target[@]}" -eq 3 ]
          restore_app="${target[0]}"
          restore_volume="${target[1]}"
          restore_machine="${target[2]}"

          retry_cleanup() {
            local description="$1" attempt
            shift
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              echo "Cleanup retry $attempt/5 failed: $description" >&2
              [ "$attempt" -eq 5 ] || sleep $((attempt * 2))
            done
            return 1
          }
          retry_cleanup "destroy restore machine" \
            flyctl machine destroy "$restore_machine" --app "$restore_app" --force \
            || echo "Machine cleanup remained inconclusive; continuing to volume and app cleanup." >&2
          retry_cleanup "destroy restore volume" \
            flyctl volumes destroy "$restore_volume" --app "$restore_app" --yes \
            || echo "Volume cleanup remained inconclusive; continuing to app cleanup." >&2
          retry_cleanup "destroy restore app" \
            flyctl apps destroy "$restore_app" --yes \
            || echo "App cleanup remained inconclusive; verifying provider inventory." >&2

          verify_recovery_absent() {
            flyctl apps list --json > "$apps_after" || return 1
            node -e '
              const fs = require("node:fs");
              const app = process.argv[1];
              const rows = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
              if (!Array.isArray(rows)) process.exit(2);
              if (rows.some((row) => String(row?.Name ?? row?.name ?? "") === app)) {
                process.stderr.write("disposable recovery target still exists after cleanup\n");
                process.exit(1);
              }
            ' "$restore_app" "$apps_after"
          }
          retry_cleanup "verify disposable recovery target absence" verify_recovery_absent || {
            echo "::error::disposable recovery target still exists after cleanup or absence could not be proven"
            exit 1
          }
          export cleanup
          node <<'NODE'
          const fs = require("node:fs");
          const evidence = {
            schemaVersion: 1,
            releaseSha: process.env.ARIA_RELEASE_SHA,
            receiptSha256: process.env.ARIA_RECOVERY_RECEIPT_SHA256,
            disposableRecoveryTargetDestroyed: true,
            destroyedAt: new Date().toISOString(),
          };
          fs.writeFileSync(process.env.cleanup, `${JSON.stringify(evidence, null, 2)}\n`, { mode: 0o600 });
          NODE

      - name: Materialize release candidate receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export deployment_receipt="$RUNNER_TEMP/aria-deployment-receipt.json"
          export admin_receipt="$RUNNER_TEMP/aria-tenant-admin-verification.json"
          export application_receipt="$RUNNER_TEMP/aria-application-acceptance.json"
          export recovery_cleanup="$RUNNER_TEMP/aria-volume-recovery-cleanup.json"
          export release_candidate_receipt="$RUNNER_TEMP/aria-release-candidate-receipt.json"
          for receipt in "$deployment_receipt" "$admin_receipt" "$application_receipt" "$recovery_cleanup"; do
            test -s "$receipt"
          done
          node <<'NODE'
          const fs = require("node:fs");
          const read = (name) => JSON.parse(fs.readFileSync(process.env[name], "utf8"));
          const deployment = read("deployment_receipt");
          const tenantAdmin = read("admin_receipt");
          const application = read("application_receipt");
          const recoveryCleanup = read("recovery_cleanup");
          const releaseSha = process.env.ARIA_RELEASE_SHA;
          const adminVerificationValid =
            (tenantAdmin.verificationMode === "existing-admin-verified" &&
              tenantAdmin.adminBootstrapApprovalSha256 === null) ||
            (tenantAdmin.verificationMode === "protected-admin-bootstrap" &&
              /^[0-9a-f]{64}$/.test(tenantAdmin.adminBootstrapApprovalSha256 ?? ""));
          if (
            deployment.schemaVersion !== 2 ||
            deployment.releaseSha !== releaseSha ||
            deployment.status !== "pending-application-acceptance" ||
            tenantAdmin.schemaVersion !== 1 ||
            tenantAdmin.releaseSha !== releaseSha ||
            tenantAdmin.recoveryReceiptSha256 !== process.env.ARIA_RECOVERY_RECEIPT_SHA256 ||
            tenantAdmin.status !== "passed" ||
            tenantAdmin.deploymentMode !== deployment.deploymentMode ||
            !adminVerificationValid ||
            tenantAdmin.identityProof !== "gotrue-active-email-provider-last-sign-in+profile-workspace-domain" ||
            tenantAdmin.realTenantAdminVerified !== true ||
            application.releaseSha !== releaseSha ||
            application.status !== "passed" ||
            application.checks?.cleanupVerified !== true ||
            application.safety?.liveSendIntentProvided !== false ||
            application.safety?.requestsWithConfirmLiveTrue !== 0 ||
            application.safety?.providerCallPreventionProof !== "exact-sha-ci-normal-tenant-route-counters" ||
            recoveryCleanup.releaseSha !== releaseSha ||
            recoveryCleanup.disposableRecoveryTargetDestroyed !== true
          ) process.exit(1);
          const receipt = {
            ...deployment,
            schemaVersion: 2,
            status: "pending-evidence-archive",
            applicationAcceptedAt: new Date().toISOString(),
            tenantAdmin: {
              status: tenantAdmin.status,
              verificationMode: tenantAdmin.verificationMode,
              recoveryReceiptSha256: tenantAdmin.recoveryReceiptSha256,
              adminBootstrapApprovalSha256: tenantAdmin.adminBootstrapApprovalSha256,
              identityProof: tenantAdmin.identityProof,
              realTenantAdminVerified: true,
              verifiedAt: tenantAdmin.verifiedAt,
            },
            applicationAcceptance: application,
            recoveryCleanup: {
              disposableRecoveryTargetDestroyed: true,
              destroyedAt: recoveryCleanup.destroyedAt,
            },
          };
          fs.writeFileSync(process.env.release_candidate_receipt, `${JSON.stringify(receipt, null, 2)}\n`, { mode: 0o600 });
          NODE

      - name: Record release evidence inventory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/aria-release-supply-chain"
          mkdir -p "$evidence"
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const temp = process.env.RUNNER_TEMP;
          const evidence = path.join(temp, "aria-release-supply-chain");
          const scannedComponents = ["app", "db", "bootstrap", "kong", "graphify", "auth", "rest"];
          const attestedComponents = ["app", "db", "bootstrap", "kong", "graphify"];
          const expected = [
            path.join(temp, "aria-deployment-receipt.json"),
            path.join(temp, "aria-tenant-admin-verification.json"),
            path.join(temp, "aria-application-acceptance.json"),
            path.join(temp, "aria-release-candidate-receipt.json"),
            path.join(temp, "aria-predeploy-receipt.json"),
            path.join(temp, "aria-volume-recovery-evidence.json"),
            path.join(temp, "aria-volume-recovery-cleanup.json"),
            path.join(evidence, "candidate-images.tsv"),
            path.join(evidence, "promoted-images.tsv"),
            path.join(evidence, "upstream-images.tsv"),
            path.join(evidence, "attestation-ids.tsv"),
            path.join(evidence, "aria-release-images.json"),
            path.join(evidence, "aria-release-manifest.json"),
            ...scannedComponents.flatMap((component) => [
              path.join(evidence, `aria-${component}.cdx.json`),
              path.join(evidence, `aria-${component}-vulnerabilities.json`),
              path.join(evidence, `aria-${component}-secrets.json`),
              path.join(evidence, `aria-${component}-artifacts.sha256`),
            ]),
            ...attestedComponents.flatMap((component) => [
              path.join(evidence, `aria-${component}-provenance.sigstore.json`),
              path.join(evidence, `aria-${component}-sbom.sigstore.json`),
            ]),
          ];
          const files = expected.map((file) => {
            const exists = fs.existsSync(file) && fs.statSync(file).isFile();
            return {
              path: path.relative(temp, file),
              exists,
              bytes: exists ? fs.statSync(file).size : null,
              sha256: exists
                ? crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex")
                : null,
            };
          });
          const inventory = {
            schemaVersion: 1,
            releaseSha: process.env.ARIA_RELEASE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            complete: files.every((file) => file.exists),
            files,
          };
          fs.writeFileSync(
            path.join(evidence, "aria-release-evidence-inventory.json"),
            `${JSON.stringify(inventory, null, 2)}\n`,
            { mode: 0o600 },
          );
          NODE

      - name: Verify successful release evidence is complete
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for artifact in \
            "$RUNNER_TEMP/aria-deployment-receipt.json" \
            "$RUNNER_TEMP/aria-tenant-admin-verification.json" \
            "$RUNNER_TEMP/aria-application-acceptance.json" \
            "$RUNNER_TEMP/aria-release-candidate-receipt.json" \
            "$RUNNER_TEMP/aria-predeploy-receipt.json" \
            "$RUNNER_TEMP/aria-volume-recovery-evidence.json" \
            "$RUNNER_TEMP/aria-volume-recovery-cleanup.json" \
            "$RUNNER_TEMP/aria-release-supply-chain/candidate-images.tsv" \
            "$RUNNER_TEMP/aria-release-supply-chain/promoted-images.tsv" \
            "$RUNNER_TEMP/aria-release-supply-chain/upstream-images.tsv" \
            "$RUNNER_TEMP/aria-release-supply-chain/attestation-ids.tsv" \
            "$RUNNER_TEMP/aria-release-supply-chain/aria-release-images.json" \
            "$RUNNER_TEMP/aria-release-supply-chain/aria-release-manifest.json"
          do
            if [ ! -s "$artifact" ]; then
              echo "::error::successful release is missing evidence: $artifact"
              exit 1
            fi
          done
          for component in app db bootstrap kong graphify auth rest; do
            for suffix in .cdx.json -vulnerabilities.json -secrets.json -artifacts.sha256; do
              artifact="$RUNNER_TEMP/aria-release-supply-chain/aria-$component$suffix"
              if [ ! -s "$artifact" ]; then
                echo "::error::successful release is missing evidence: $artifact"
                exit 1
              fi
            done
          done
          for component in app db bootstrap kong graphify; do
            for suffix in -provenance.sigstore.json -sbom.sigstore.json; do
              artifact="$RUNNER_TEMP/aria-release-supply-chain/aria-$component$suffix"
              if [ ! -s "$artifact" ]; then
                echo "::error::successful release is missing attestation evidence: $artifact"
                exit 1
              fi
            done
          done

      - name: Archive non-secret release candidate and supply-chain evidence
        if: always()
        id: archive_candidate_evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aria-release-candidate-evidence-${{ inputs.release_sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aria-deployment-receipt.json
            ${{ runner.temp }}/aria-tenant-admin-verification.json
            ${{ runner.temp }}/aria-application-acceptance.json
            ${{ runner.temp }}/aria-release-candidate-receipt.json
            ${{ runner.temp }}/aria-predeploy-receipt.json
            ${{ runner.temp }}/aria-volume-recovery-evidence.json
            ${{ runner.temp }}/aria-volume-recovery-cleanup.json
            ${{ runner.temp }}/aria-release-supply-chain/candidate-images.tsv
            ${{ runner.temp }}/aria-release-supply-chain/promoted-images.tsv
            ${{ runner.temp }}/aria-release-supply-chain/upstream-images.tsv
            ${{ runner.temp }}/aria-release-supply-chain/attestation-ids.tsv
            ${{ runner.temp }}/aria-release-supply-chain/aria-release-images.json
            ${{ runner.temp }}/aria-release-supply-chain/aria-release-manifest.json
            ${{ runner.temp }}/aria-release-supply-chain/aria-*.cdx.json
            ${{ runner.temp }}/aria-release-supply-chain/aria-*-vulnerabilities.json
            ${{ runner.temp }}/aria-release-supply-chain/aria-*-secrets.json
            ${{ runner.temp }}/aria-release-supply-chain/aria-*-artifacts.sha256
            ${{ runner.temp }}/aria-release-supply-chain/aria-*-provenance.sigstore.json
            ${{ runner.temp }}/aria-release-supply-chain/aria-*-sbom.sigstore.json
            ${{ runner.temp }}/aria-release-supply-chain/aria-release-evidence-inventory.json
          if-no-files-found: error
          retention-days: 90

      - name: Finalize accepted release receipt
        if: success()
        shell: bash
        env:
          ARIA_RELEASE_EVIDENCE_ARTIFACT_ID: ${{ steps.archive_candidate_evidence.outputs.artifact-id }}
          ARIA_RELEASE_EVIDENCE_ARTIFACT_SHA256: ${{ steps.archive_candidate_evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          umask 077
          export release_candidate_receipt="$RUNNER_TEMP/aria-release-candidate-receipt.json"
          export evidence_inventory="$RUNNER_TEMP/aria-release-supply-chain/aria-release-evidence-inventory.json"
          export release_receipt="$RUNNER_TEMP/aria-release-receipt.json"
          test -s "$release_candidate_receipt"
          test -s "$evidence_inventory"
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const candidateBytes = fs.readFileSync(process.env.release_candidate_receipt);
          const inventoryBytes = fs.readFileSync(process.env.evidence_inventory);
          const candidate = JSON.parse(candidateBytes.toString("utf8"));
          const inventory = JSON.parse(inventoryBytes.toString("utf8"));
          const releaseSha = process.env.ARIA_RELEASE_SHA;
          const evidenceArtifactId = process.env.ARIA_RELEASE_EVIDENCE_ARTIFACT_ID ?? "";
          const evidenceArtifactSha256 = process.env.ARIA_RELEASE_EVIDENCE_ARTIFACT_SHA256 ?? "";
          const candidateSha256 = crypto.createHash("sha256").update(candidateBytes).digest("hex");
          const inventoryEntry = inventory.files?.find(
            (file) => file?.path === "aria-release-candidate-receipt.json",
          );
          if (
            candidate.schemaVersion !== 2 ||
            candidate.releaseSha !== releaseSha ||
            candidate.status !== "pending-evidence-archive" ||
            inventory.schemaVersion !== 1 ||
            inventory.releaseSha !== releaseSha ||
            inventory.complete !== true ||
            inventoryEntry?.exists !== true ||
            inventoryEntry?.sha256 !== candidateSha256 ||
            !/^[1-9][0-9]*$/.test(evidenceArtifactId) ||
            !/^[0-9a-f]{64}$/.test(evidenceArtifactSha256)
          ) process.exit(1);
          const receipt = {
            ...candidate,
            status: "accepted",
            acceptedAt: new Date().toISOString(),
            evidenceInventorySha256: crypto.createHash("sha256").update(inventoryBytes).digest("hex"),
            evidenceArtifact: {
              id: evidenceArtifactId,
              sha256: evidenceArtifactSha256,
            },
          };
          fs.writeFileSync(process.env.release_receipt, `${JSON.stringify(receipt, null, 2)}\n`, { mode: 0o600 });
          NODE

      - name: Archive accepted release receipt
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aria-accepted-release-${{ inputs.release_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aria-release-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Announce accepted release
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          release_receipt="$RUNNER_TEMP/aria-release-receipt.json"
          test -s "$release_receipt"
          node -e '
            const fs = require("node:fs");
            const receipt = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (
              receipt.schemaVersion !== 2 ||
              receipt.releaseSha !== process.env.ARIA_RELEASE_SHA ||
              receipt.status !== "accepted" ||
              !/^[0-9a-f]{64}$/.test(receipt.evidenceInventorySha256 ?? "") ||
              !/^[1-9][0-9]*$/.test(receipt.evidenceArtifact?.id ?? "") ||
              !/^[0-9a-f]{64}$/.test(receipt.evidenceArtifact?.sha256 ?? "")
            ) process.exit(1);
          ' "$release_receipt"
          echo "RELEASE_ACCEPTED sha=$ARIA_RELEASE_SHA receipt=$release_receipt"
