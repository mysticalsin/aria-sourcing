name: Deploy Aria Mantu (Fly)

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character commit SHA already passed by CI and CodeQL
        required: true
        type: string
      recovery_receipt_sha256:
        description: SHA-256 of the independently reviewed production recovery receipt
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: aria-production
  cancel-in-progress: false

jobs:
  validate-dispatch:
    name: Validate protected release dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARIA_RELEASE_SHA: ${{ inputs.release_sha }}
      ARIA_RECOVERY_RECEIPT_SHA256: ${{ inputs.recovery_receipt_sha256 }}
      ARIA_WORKFLOW_REF: ${{ github.ref }}
      ARIA_WORKFLOW_REF_TYPE: ${{ github.ref_type }}
      ARIA_WORKFLOW_REF_PROTECTED: ${{ github.ref_protected }}
      ARIA_WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Validate release input and workflow identity
        shell: bash
        run: |
          if [[ ! "$ARIA_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_sha must be an exact lowercase 40-character Git SHA"
            exit 1
          fi
          if [[ ! "$ARIA_RECOVERY_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::recovery_receipt_sha256 must be an exact lowercase SHA-256"
            exit 1
          fi
          if [ "$ARIA_WORKFLOW_REF" != "refs/heads/deploy/fly-github-actions" ] \
             || [ "$ARIA_WORKFLOW_REF_TYPE" != "branch" ] \
             || [ "$ARIA_WORKFLOW_REF_PROTECTED" != "true" ]; then
            echo "::error::production dispatch must execute from the protected release branch"
            exit 1
          fi
          if [ "$ARIA_WORKFLOW_SHA" != "$ARIA_RELEASE_SHA" ]; then
            echo "::error::release_sha must equal the commit that supplied this workflow definition"
            exit 1
          fi

  deploy:
    name: Protected production deploy
    needs: validate-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: Production
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: read
    env:
      ARIA_RELEASE_SHA: ${{ inputs.release_sha }}
      ARIA_RECOVERY_RECEIPT_SHA256: ${{ inputs.recovery_receipt_sha256 }}
      ARIA_LOCAL_APP_IMAGE: aria-mantu-app:sha-${{ inputs.release_sha }}
      ARIA_LOCAL_DB_IMAGE: aria-mantu-db:sha-${{ inputs.release_sha }}
      ARIA_LOCAL_BOOTSTRAP_IMAGE: aria-mantu-bootstrap:sha-${{ inputs.release_sha }}
      ARIA_LOCAL_KONG_IMAGE: aria-mantu-kong:sha-${{ inputs.release_sha }}
      ARIA_LOCAL_GRAPHIFY_IMAGE: aria-graphify-lessons:sha-${{ inputs.release_sha }}
      TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
      CYCLONEDX_CLI_IMAGE: cyclonedx/cyclonedx-cli:0.32.0@sha256:9a858a15e7b0843606efc0ff19d5f7575011a5428d7f3d343b4f6cf09d8f0d4e
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact release
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release identity and required workflows
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$ARIA_RELEASE_SHA" ]; then
            echo "::error::checked out $actual_sha instead of $ARIA_RELEASE_SHA"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$ARIA_RELEASE_SHA" "origin/deploy/fly-github-actions"; then
            echo "::error::release SHA is not on the production release branch"
            exit 1
          fi

          require_workflow_success() {
            local workflow="$1" result
            result="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$ARIA_RELEASE_SHA" --limit 1 --json conclusion,headSha,status --jq '.[0] | "\(.headSha) \(.status) \(.conclusion)"')"
            if [ "$result" != "$ARIA_RELEASE_SHA completed success" ]; then
              echo "::error::$workflow has no successful completed run for $ARIA_RELEASE_SHA (result: ${result:-none})"
              exit 1
            fi
          }

          require_workflow_success ci.yml
          require_workflow_success codeql.yml

          for severity in critical high; do
            alerts="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/code-scanning/alerts" \
              -f state=open \
              -f ref=refs/heads/deploy/fly-github-actions \
              -f severity="$severity" \
              -f per_page=1)"
            open_code_alerts="$(printf '%s' "$alerts" | node -e '
              let body = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => body += chunk);
              process.stdin.on("end", () => {
                const rows = JSON.parse(body);
                if (!Array.isArray(rows)) process.exit(1);
                process.stdout.write(String(rows.length));
              });
            ')"
            if [ "$open_code_alerts" -ne 0 ]; then
              echo "::error::open $severity code-scanning alert blocks release $ARIA_RELEASE_SHA"
              exit 1
            fi
          done

      - name: Install pinned flyctl action
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.4.69

      - name: Validate preserved production recovery point
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_RECOVERY_AUDIT_TOKEN }}
          ARIA_VOLUME_RECOVERY_RECEIPT_JSON: ${{ secrets.ARIA_VOLUME_RECOVERY_RECEIPT_JSON }}
          ARIA_VOLUME_RESTORE_CREATE_REQUEST_JSON: ${{ secrets.ARIA_VOLUME_RESTORE_CREATE_REQUEST_JSON }}
          ARIA_VOLUME_RESTORE_CREATE_RESPONSE_JSON: ${{ secrets.ARIA_VOLUME_RESTORE_CREATE_RESPONSE_JSON }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$FLY_API_TOKEN"
          test -n "$ARIA_VOLUME_RECOVERY_RECEIPT_JSON"
          test -n "$ARIA_VOLUME_RESTORE_CREATE_REQUEST_JSON"
          test -n "$ARIA_VOLUME_RESTORE_CREATE_RESPONSE_JSON"
          receipt="$RUNNER_TEMP/aria-volume-recovery-receipt.json"
          restore_request="$RUNNER_TEMP/aria-volume-restore-create-request.json"
          restore_response="$RUNNER_TEMP/aria-volume-restore-create-response.json"
          volumes="$RUNNER_TEMP/aria-volume-recovery-volumes.json"
          snapshots="$RUNNER_TEMP/aria-volume-recovery-snapshots.json"
          restore_volumes="$RUNNER_TEMP/aria-volume-recovery-restore-volumes.json"
          source_machines="$RUNNER_TEMP/aria-volume-recovery-source-machines.json"
          restore_machines="$RUNNER_TEMP/aria-volume-recovery-restore-machines.json"
          source_ips="$RUNNER_TEMP/aria-volume-recovery-source-ips.json"
          restore_ips="$RUNNER_TEMP/aria-volume-recovery-restore-ips.json"
          cleanup_target="$RUNNER_TEMP/aria-volume-recovery-cleanup-target.json"
          reviews="$RUNNER_TEMP/aria-production-approval-reviews.json"
          evidence="$RUNNER_TEMP/aria-volume-recovery-evidence.json"
          export receipt restore_request restore_response
          node <<'NODE'
          const fs = require("node:fs");
          const inputs = [
            ["ARIA_VOLUME_RECOVERY_RECEIPT_JSON", "receipt"],
            ["ARIA_VOLUME_RESTORE_CREATE_REQUEST_JSON", "restore_request"],
            ["ARIA_VOLUME_RESTORE_CREATE_RESPONSE_JSON", "restore_response"],
          ];
          for (const [valueName, pathName] of inputs) {
            const value = process.env[valueName];
            if (!value || Buffer.byteLength(value, "utf8") > 65_536) {
              throw new Error(`${valueName} is missing or oversized`);
            }
            const document = JSON.parse(value);
            if (!document || typeof document !== "object" || Array.isArray(document)) {
              throw new Error(`${valueName} must contain one JSON object`);
            }
            fs.writeFileSync(process.env[pathName], `${JSON.stringify(document)}\n`, { mode: 0o600 });
          }
          NODE
          actual_receipt_sha256="$(sha256sum "$receipt" | awk '{print $1}')"
          if [ "$actual_receipt_sha256" != "$ARIA_RECOVERY_RECEIPT_SHA256" ]; then
            echo "::error::protected recovery receipt does not match the visible dispatch digest"
            exit 1
          fi
          volume_id="$(node -e '
            const fs = require("node:fs");
            const document = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const value = document?.production?.volumeId;
            if (!/^vol_[A-Za-z0-9]+$/.test(value ?? "")) process.exit(1);
            process.stdout.write(value);
          ' "$receipt")"
          restore_app="$(node -e '
            const fs = require("node:fs");
            const document = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const value = document?.restoreDrill?.targetApp;
            if (!/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(value ?? "")) process.exit(1);
            if (value === "aria-mantu-db") process.exit(1);
            process.stdout.write(value);
          ' "$receipt")"
          flyctl volumes list --app aria-mantu-db --json > "$volumes"
          flyctl volumes snapshots list "$volume_id" --app aria-mantu-db --json > "$snapshots"
          flyctl volumes list --app "$restore_app" --json > "$restore_volumes"
          flyctl machines list --app aria-mantu-db --json > "$source_machines"
          flyctl machines list --app "$restore_app" --json > "$restore_machines"
          flyctl ips list --app aria-mantu-db --json > "$source_ips"
          flyctl ips list --app "$restore_app" --json > "$restore_ips"
          node scripts/validate-volume-recovery-receipt.mjs \
            "$receipt" "$volumes" "$snapshots" "$restore_volumes" \
            "$source_ips" "$restore_ips" "$restore_request" "$restore_response" \
            "$source_machines" "$restore_machines" "$ARIA_RELEASE_SHA"
          export cleanup_target actual_receipt_sha256 restore_volumes restore_machines
          node <<'NODE'
          const fs = require("node:fs");
          const receipt = JSON.parse(fs.readFileSync(process.env.receipt, "utf8"));
          const volumes = JSON.parse(fs.readFileSync(process.env.restore_volumes, "utf8"));
          const machines = JSON.parse(fs.readFileSync(process.env.restore_machines, "utf8"));
          const expectedApp = `aria-mantu-db-recovery-${process.env.ARIA_RELEASE_SHA.slice(0, 12)}`;
          if (
            receipt.restoreDrill.targetApp !== expectedApp ||
            !Array.isArray(volumes) || volumes.length !== 1 ||
            !Array.isArray(machines) || machines.length !== 1
          ) throw new Error("validated recovery target is not singular");
          const volume = volumes[0];
          const machine = machines[0];
          if (
            volume.id !== receipt.restoreDrill.targetVolumeId ||
            volume.attached_machine_id !== receipt.restoreDrill.targetMachineId ||
            machine.id !== receipt.restoreDrill.targetMachineId ||
            !/^vol_[A-Za-z0-9]+$/.test(volume.id ?? "") ||
            !/^[0-9a-f]{14}$/.test(machine.id ?? "")
          ) throw new Error("validated recovery target identity changed");
          const target = {
            schemaVersion: 1,
            releaseSha: process.env.ARIA_RELEASE_SHA,
            receiptSha256: process.env.actual_receipt_sha256,
            app: expectedApp,
            volumeId: volume.id,
            machineId: machine.id,
          };
          fs.writeFileSync(process.env.cleanup_target, `${JSON.stringify(target)}\n`, { mode: 0o600 });
          NODE
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > "$reviews"
          export reviews evidence actual_receipt_sha256 volumes snapshots restore_volumes source_machines restore_machines source_ips restore_ips
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const receipt = JSON.parse(fs.readFileSync(process.env.receipt, "utf8"));
          const reviews = JSON.parse(fs.readFileSync(process.env.reviews, "utf8"));
          const actor = String(process.env.GITHUB_ACTOR ?? "").toLowerCase();
          const triggeringActor = String(process.env.GITHUB_TRIGGERING_ACTOR ?? "").toLowerCase();
          const approvedBy = String(receipt.approval.approvedBy).toLowerCase();
          const expectedComment = `recovery-receipt-sha256:${process.env.actual_receipt_sha256}`;
          const matching = Array.isArray(reviews) && reviews.some((review) =>
            review?.state === "approved" &&
            String(review?.comment ?? "").trim() === expectedComment &&
            String(review?.user?.login ?? "").toLowerCase() === approvedBy &&
            Array.isArray(review?.environments) &&
            review.environments.some((environment) => environment?.name === "Production")
          );
          if (
            !matching || !actor || !triggeringActor ||
            approvedBy === actor || approvedBy === triggeringActor
          ) {
            throw new Error("Production approval is absent, mismatched, or self-approved");
          }
          const sha256 = (path) => crypto.createHash("sha256").update(fs.readFileSync(path)).digest("hex");
          const evidence = {
            schemaVersion: 1,
            validatedAt: new Date().toISOString(),
            releaseSha: process.env.ARIA_RELEASE_SHA,
            receiptSha256: process.env.actual_receipt_sha256,
            reviewerBound: true,
            approvalActors: {
              initialActor: actor,
              triggeringActor,
              approvedBy,
            },
            providerStateSha256: {
              restoreCreateRequest: sha256(process.env.restore_request),
              restoreCreateResponse: sha256(process.env.restore_response),
              sourceVolume: sha256(process.env.volumes),
              sourceSnapshots: sha256(process.env.snapshots),
              restoreVolume: sha256(process.env.restore_volumes),
              sourceMachines: sha256(process.env.source_machines),
              restoreMachines: sha256(process.env.restore_machines),
              sourcePublicIps: sha256(process.env.source_ips),
              restorePublicIps: sha256(process.env.restore_ips),
            },
          };
          fs.writeFileSync(process.env.evidence, `${JSON.stringify(evidence, null, 2)}\n`, { mode: 0o600 });
          NODE

      - name: Install pinned Cosign verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify the pinned Trivy scanner signature
        shell: bash
        run: |
          set -euo pipefail
          cosign verify "$TRIVY_IMAGE" \
            --certificate-identity-regexp 'https://github\.com/aquasecurity/trivy/\.github/workflows/.+' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            >/dev/null

      - name: Build exact release custom images
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.FLY_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_ALLOWED_EMAIL_DOMAIN: ${{ vars.ARIA_ALLOWED_EMAIL_DOMAIN }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          node scripts/validate-email-domain.mjs "$NEXT_PUBLIC_ALLOWED_EMAIL_DOMAIN"
          docker build \
            --pull \
            --platform linux/amd64 \
            --file Dockerfile.prod \
            --tag "$ARIA_LOCAL_APP_IMAGE" \
            --label "org.opencontainers.image.revision=$ARIA_RELEASE_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://aria-mantu-kong.fly.dev \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --build-arg NEXT_PUBLIC_ALLOWED_EMAIL_DOMAIN="$NEXT_PUBLIC_ALLOWED_EMAIL_DOMAIN" \
            --build-arg NEXT_PUBLIC_ENABLE_DEMO_LOGIN=false \
            --build-arg NEXT_PUBLIC_ENABLE_AZURE_LOGIN=false \
            .
          docker build --pull --platform linux/amd64 \
            --file docker/db/Dockerfile.fly \
            --tag "$ARIA_LOCAL_DB_IMAGE" \
            --label "org.opencontainers.image.revision=$ARIA_RELEASE_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            .
          docker build --pull --platform linux/amd64 \
            --file docker/bootstrap/Dockerfile.fly \
            --tag "$ARIA_LOCAL_BOOTSTRAP_IMAGE" \
            --label "org.opencontainers.image.revision=$ARIA_RELEASE_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            .
          docker build --pull --platform linux/amd64 \
            --file docker/kong/Dockerfile.fly \
            --tag "$ARIA_LOCAL_KONG_IMAGE" \
            --label "org.opencontainers.image.revision=$ARIA_RELEASE_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            .
          docker build --pull --platform linux/amd64 \
            --file workers/graphify-lessons/Dockerfile \
            --tag "$ARIA_LOCAL_GRAPHIFY_IMAGE" \
            --label "org.opencontainers.image.revision=$ARIA_RELEASE_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            workers/graphify-lessons
          GRAPHIFY_IMAGE="$ARIA_LOCAL_GRAPHIFY_IMAGE" npm run test:graphify-learning
          mkdir -p "$RUNNER_TEMP/aria-release-supply-chain/input"

      - name: Publish candidate images and materialize exact registry inputs
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          evidence="$RUNNER_TEMP/aria-release-supply-chain"
          mkdir -p "$evidence/input"
          cleanup_registry() { docker logout registry.fly.io >/dev/null 2>&1 || true; }
          trap cleanup_registry EXIT
          flyctl auth docker >/dev/null

          digest_for() {
            local image="$1" manifest="" attempt digest
            for attempt in 1 2 3 4 5 6; do
              if manifest="$(docker buildx imagetools inspect "$image" --raw 2>/dev/null)" && [ -n "$manifest" ]; then
                break
              fi
              sleep 5
            done
            [ -n "$manifest" ] || return 1
            digest="$(
              printf '%s' "$manifest" | node -e '
                const crypto = require("node:crypto");
                const hash = crypto.createHash("sha256");
                process.stdin.on("data", (chunk) => hash.update(chunk));
                process.stdin.on("end", () => process.stdout.write(`sha256:${hash.digest("hex")}`));
              '
            )" || return 1
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
            printf '%s' "$digest"
          }

          : > "$evidence/candidate-images.tsv"
          for specification in \
            "app|aria-mantu-app|$ARIA_LOCAL_APP_IMAGE|ARIA_APP_CANDIDATE_REF" \
            "db|aria-mantu-db|$ARIA_LOCAL_DB_IMAGE|ARIA_DB_CANDIDATE_REF" \
            "bootstrap|aria-mantu-bootstrap|$ARIA_LOCAL_BOOTSTRAP_IMAGE|ARIA_BOOTSTRAP_CANDIDATE_REF" \
            "kong|aria-mantu-kong|$ARIA_LOCAL_KONG_IMAGE|ARIA_KONG_CANDIDATE_REF" \
            "graphify|aria-graphify-lessons|$ARIA_LOCAL_GRAPHIFY_IMAGE|ARIA_GRAPHIFY_CANDIDATE_REF"
          do
            IFS='|' read -r component app local_image variable <<< "$specification"
            candidate_tag="registry.fly.io/$app:candidate-$ARIA_RELEASE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            docker tag "$local_image" "$candidate_tag"
            docker push "$candidate_tag"
            digest="$(digest_for "$candidate_tag")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            candidate_ref="$candidate_tag@$digest"
            docker pull "$candidate_ref"
            docker image save --output "$evidence/input/aria-$component-image.tar" "$candidate_ref"
            printf '%s=%s\n' "$variable" "$candidate_ref" >> "$GITHUB_ENV"
            printf '%s\t%s\t%s\n' "$component" "$app" "$candidate_ref" >> "$evidence/candidate-images.tsv"
          done

          export ARIA_UPSTREAM_IMAGES_FILE="$evidence/upstream-images.tsv"
          node <<'NODE'
          const fs = require("node:fs");
          const specifications = [
            ["auth", "fly.auth.toml", "supabase/gotrue"],
            ["rest", "fly.rest.toml", "postgrest/postgrest"],
          ];
          const rows = specifications.map(([component, file, repository]) => {
            const source = fs.readFileSync(file, "utf8");
            const matches = [...source.matchAll(/^\s*image\s*=\s*"([^"]+)"\s*$/gm)].map((match) => match[1]);
            const escaped = repository.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            if (matches.length !== 1 || !new RegExp(`^${escaped}:[^@\\s]+@sha256:[0-9a-f]{64}$`).test(matches[0])) {
              process.exit(1);
            }
            return `${component}\t${repository}\t${matches[0]}`;
          });
          fs.writeFileSync(process.env.ARIA_UPSTREAM_IMAGES_FILE, `${rows.join("\n")}\n`, { mode: 0o600 });
          NODE
          while IFS=$'\t' read -r component repository upstream_ref; do
            docker pull --platform linux/amd64 "$upstream_ref"
            docker image save --output "$evidence/input/aria-$component-image.tar" "$upstream_ref"
            variable="ARIA_${component^^}_UPSTREAM_IMAGE_REF"
            printf '%s=%s\n' "$variable" "$upstream_ref" >> "$GITHUB_ENV"
          done < "$evidence/upstream-images.tsv"

      - name: Scan exact registry candidate images
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.FLY_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/aria-release-supply-chain"
          mkdir -p "$evidence/cache"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          validate_cyclonedx() {
            local host_dir="$1" file="$2"
            docker run --rm \
              --network none \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --tmpfs /tmp:rw,noexec,nosuid,size=16m \
              --volume "$host_dir:/artifacts:ro" \
              "$CYCLONEDX_CLI_IMAGE" validate \
              --input-file "/artifacts/$file" \
              --input-format json \
              --input-version v1_7 \
              --fail-on-errors
          }

          export ARIA_CYCLONEDX_PROBE_DIR="$evidence"
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const dir = process.env.ARIA_CYCLONEDX_PROBE_DIR;
          fs.writeFileSync(
            path.join(dir, "validator-valid.cdx.json"),
            `${JSON.stringify({ bomFormat: "CycloneDX", specVersion: "1.7", version: 1 })}\n`,
          );
          fs.writeFileSync(
            path.join(dir, "validator-invalid.cdx.json"),
            `${JSON.stringify({ bomFormat: "CycloneDX", specVersion: "1.7", version: 0, unexpected: true })}\n`,
          );
          NODE
          validate_cyclonedx "$evidence" validator-valid.cdx.json
          if validate_cyclonedx "$evidence" validator-invalid.cdx.json >/dev/null 2>&1; then
            echo "::error::CycloneDX validator accepted the malformed control document"
            exit 1
          fi
          rm -f "$evidence/validator-valid.cdx.json" "$evidence/validator-invalid.cdx.json"

          export ARIA_TRIVY_SECRET_CONFIG="$evidence/trivy-secret.yaml"
          node <<'NODE'
          const fs = require("node:fs");
          const value = process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY;
          const escaped = value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const config = {
            // linkedin-client-id detects a public OAuth client identifier (not a
            // credential) and false-fires on Sillage request field names compiled
            // into the app bundle. linkedin-client-secret remains armed.
            "disable-rules": ["linkedin-client-id"],
            "allow-rules": [{
              id: "aria-public-browser-anon-key",
              description: "Supabase anon JWT is an intentionally public browser build input",
              regex: escaped,
            }],
          };
          fs.writeFileSync(process.env.ARIA_TRIVY_SECRET_CONFIG, `${JSON.stringify(config, null, 2)}\n`, { mode: 0o600 });
          NODE
          for component in app db bootstrap kong graphify auth rest; do
            docker run --rm \
              --volume "$evidence/input:/image:ro" \
              --volume "$evidence/cache:/trivy-cache" \
              --volume "$evidence:/artifacts" \
              "$TRIVY_IMAGE" image \
              --input "/image/aria-$component-image.tar" \
              --cache-dir /trivy-cache \
              --format cyclonedx \
              --output "/artifacts/aria-$component.cdx.json" \
              --timeout 15m
            validate_cyclonedx "$evidence" "aria-$component.cdx.json"
            docker run --rm \
              --volume "$evidence/input:/image:ro" \
              --volume "$evidence/cache:/trivy-cache" \
              --volume "$evidence:/artifacts" \
              "$TRIVY_IMAGE" image \
              --input "/image/aria-$component-image.tar" \
              --cache-dir /trivy-cache \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed=true \
              --exit-code 1 \
              --format json \
              --output "/artifacts/aria-$component-vulnerabilities.json" \
              --timeout 15m
            docker run --rm \
              --volume "$evidence/input:/image:ro" \
              --volume "$evidence/cache:/trivy-cache" \
              --volume "$evidence:/artifacts" \
              "$TRIVY_IMAGE" image \
              --input "/image/aria-$component-image.tar" \
              --cache-dir /trivy-cache \
              --scanners secret \
              --image-config-scanners secret \
              --secret-config /artifacts/trivy-secret.yaml \
              --exit-code 1 \
              --format json \
              --output "/artifacts/aria-$component-secrets.json" \
              --timeout 15m
          done
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["RUNNER_TEMP"]) / "aria-release-supply-chain"
          for component in ("app", "db", "bootstrap", "kong", "graphify", "auth", "rest"):
              path = evidence / f"aria-{component}.cdx.json"
              document = json.loads(path.read_text(encoding="utf-8"))
              if document.get("bomFormat") != "CycloneDX":
                  raise SystemExit(f"{component} SBOM is not CycloneDX")
              if document.get("metadata", {}).get("component", {}).get("type") != "container":
                  raise SystemExit(f"{component} SBOM metadata is not a container")
              if not document.get("components"):
                  raise SystemExit(f"{component} SBOM component inventory is empty")
          PY
          (
            cd "$evidence"
            for component in app db bootstrap kong graphify auth rest; do
              sha256sum \
                "aria-$component.cdx.json" \
                "aria-$component-vulnerabilities.json" \
                "aria-$component-secrets.json" \
                > "aria-$component-artifacts.sha256"
            done
          )

      - name: Promote only exact scanned candidate digests
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          evidence="$RUNNER_TEMP/aria-release-supply-chain"
          cleanup_registry() { docker logout registry.fly.io >/dev/null 2>&1 || true; }
          trap cleanup_registry EXIT
          flyctl auth docker >/dev/null

          digest_for() {
            local image="$1" manifest digest error_file
            error_file="$(mktemp "$RUNNER_TEMP/aria-registry-inspect.XXXXXX")" || return 45
            if ! manifest="$(docker buildx imagetools inspect "$image" --raw 2>"$error_file")"; then
              if grep -Eiq 'manifest unknown|name unknown|: not found$' "$error_file"; then
                rm -f "$error_file"
                return 44
              fi
              echo "::error::registry lookup failed for $image; refusing to treat it as an absent tag" >&2
              rm -f "$error_file"
              return 45
            fi
            rm -f "$error_file"
            [ -n "$manifest" ] || return 45
            digest="$(
              printf '%s' "$manifest" | node -e '
                const crypto = require("node:crypto");
                const hash = crypto.createHash("sha256");
                process.stdin.on("data", (chunk) => hash.update(chunk));
                process.stdin.on("end", () => process.stdout.write(`sha256:${hash.digest("hex")}`));
              '
            )" || return 45
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || return 45
            printf '%s' "$digest"
          }

          : > "$evidence/promoted-images.tsv"
          while IFS=$'\t' read -r component app candidate_ref; do
            candidate_digest="${candidate_ref##*@}"
            release_tag="registry.fly.io/$app:sha-$ARIA_RELEASE_SHA"
            if existing_digest="$(digest_for "$release_tag")"; then
              if [ "$existing_digest" != "$candidate_digest" ]; then
                echo "::error::$release_tag already exists with a different digest"
                exit 1
              fi
            else
              lookup_status=$?
              if [ "$lookup_status" -ne 44 ]; then
                echo "::error::unable to prove whether $release_tag exists; refusing promotion"
                exit 1
              fi
              docker tag "$candidate_ref" "$release_tag"
              docker push "$release_tag"
            fi
            promoted_digest="$(digest_for "$release_tag")"
            [ "$promoted_digest" = "$candidate_digest" ]
            variable="ARIA_${component^^}_IMAGE_REF"
            digest_variable="ARIA_${component^^}_IMAGE_DIGEST"
            promoted_ref="$release_tag@$promoted_digest"
            printf '%s=%s\n' "$variable" "$promoted_ref" >> "$GITHUB_ENV"
            printf '%s=%s\n' "$digest_variable" "$promoted_digest" >> "$GITHUB_ENV"
            printf '%s\t%s\n' "$component" "$promoted_ref" >> "$evidence/promoted-images.tsv"
          done < "$evidence/candidate-images.tsv"

          export ARIA_PROMOTED_IMAGES_FILE="$evidence/promoted-images.tsv"
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const images = Object.fromEntries(
            fs.readFileSync(process.env.ARIA_PROMOTED_IMAGES_FILE, "utf8")
              .trim()
              .split("\n")
              .filter(Boolean)
              .map((line) => line.split("\t")),
          );
          const upstreamImages = Object.fromEntries(
            fs.readFileSync(path.join(path.dirname(process.env.ARIA_PROMOTED_IMAGES_FILE), "upstream-images.tsv"), "utf8")
              .trim()
              .split("\n")
              .filter(Boolean)
              .map((line) => {
                const [component, repository, image] = line.split("\t");
                return [component, { repository, image }];
              }),
          );
          const receipt = {
            schemaVersion: 2,
            releaseSha: process.env.ARIA_RELEASE_SHA,
            platform: "linux/amd64",
            scanner: process.env.TRIVY_IMAGE,
            sbomValidator: process.env.CYCLONEDX_CLI_IMAGE,
            images,
            upstreamImages,
          };
          const evidence = path.dirname(process.env.ARIA_PROMOTED_IMAGES_FILE);
          fs.writeFileSync(path.join(evidence, "aria-release-images.json"), `${JSON.stringify(receipt, null, 2)}\n`, { mode: 0o600 });
          NODE

      - name: Attest app build provenance
        id: attest_app_provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: registry.fly.io/aria-mantu-app
          subject-digest: ${{ env.ARIA_APP_IMAGE_DIGEST }}

      - name: Attest app SBOM
        id: attest_app_sbom
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: registry.fly.io/aria-mantu-app
          subject-digest: ${{ env.ARIA_APP_IMAGE_DIGEST }}
          sbom-path: ${{ runner.temp }}/aria-release-supply-chain/aria-app.cdx.json

      - name: Attest database build provenance
        id: attest_db_provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
