          subject-digest: ${{ env.ARIA_BOOTSTRAP_IMAGE_DIGEST }}
          sbom-path: ${{ runner.temp }}/aria-release-supply-chain/aria-bootstrap.cdx.json

      - name: Attest Kong build provenance
        id: attest_kong_provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
