# Disposable database password for the local CI containers only.
# It is the public default from the Odoo image, not a credential.

services:
  postgres:
    image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    image: odoo:19@sha256:03a47921f9eef2c225ded1167fe7828465d2b3177883f30d173bb1c3c792949b
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: postgres
      PORT: "5432"
      USER: odoo
      PASSWORD: odoo
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../..:/mnt/extra-addons:ro
    command:
      - odoo
      - --workers=0
      - --max-cron-threads=0
      - --limit-time-real=1800
      - --limit-time-cpu=1800
      - -d
      - aria_recruitment_ci
      - -i
      - aria_recruitment
      - --without-demo=all
      - --test-enable
      - --stop-after-init
      - --test-tags=/aria_recruitment
      - --log-level=info
