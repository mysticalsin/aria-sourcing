# aria-mantu-app, the public Next.js service.
# The protected workflow builds Dockerfile.prod with the public build inputs,
# scans and publishes that exact image, then deploys its immutable registry
# digest with `fly deploy --image`. The [build] block documents the canonical
# Dockerfile and public defaults; the protected release does not rebuild here.
app            = "aria-mantu-app"
primary_region = "cdg"

[processes]
  web                 = "server.js"
  cleanup             = "scripts/apollo-authority-cleanup-worker.mjs"
  framework_heartbeat = "scripts/agent-framework-heartbeat-worker.mjs"
  loop                = "scripts/sourcing-loop-worker.mjs"

[build]
  dockerfile = "Dockerfile.prod"
  [build.args]
    NEXT_PUBLIC_SUPABASE_URL         = "https://aria-mantu-kong.fly.dev"   # browser → Supabase (public Kong)
    NEXT_PUBLIC_ALLOWED_EMAIL_DOMAIN = ""
    NEXT_PUBLIC_ENABLE_DEMO_LOGIN    = "false"                       # real tenant: OFF → strict fail-closed
    NEXT_PUBLIC_ENABLE_AZURE_LOGIN   = "false"                       # enable only with complete GoTrue Azure config
    # NEXT_PUBLIC_SUPABASE_ANON_KEY passed on the CLI (see deploy cmd above)

[env]
  NODE_ENV                      = "production"
  PORT                          = "3000"
  HOSTNAME                      = "0.0.0.0"
  NEXT_TELEMETRY_DISABLED       = "1"
  # Server (Node) reaches Supabase over the 6PN private net, NOT the public URL:
  SUPABASE_URL                  = "http://aria-mantu-kong.internal:8000"
  # Inert until a seat goes live (also needs a provider key + verified domain); safe to set now:
  OUTREACH_UNSUBSCRIBE_BASE_URL = "https://aria-mantu-app.fly.dev"
  # Loop worker → web process, over 6PN (process-group DNS). Used only by the
  # "loop" process for its minute-level outbound drain; harmless elsewhere.
  ARIA_WEB_INTERNAL_URL         = "http://web.process.aria-mantu-app.internal:3000"
  # Every protected release starts the autonomous loop dark. Activation is a
  # separate reviewed operation and cannot be inherited from an older Machine.
  ARIA_LOOP_KILL_SWITCH         = "true"
  ARIA_LOOP_ENABLE_OUTBOUND_DRAIN = "false"
  # Release readiness is explicit while the loop is dark. The reviewed
  # activation workflow sets this and ARIA_LOOP_KILL_SWITCH to "true"/"false"
  # respectively for the exact deployed release.
  ARIA_SOURCING_OPERATIONAL_REQUIRED = "false"
  # Production readiness requires an external OTLP collector. Endpoint and
  # authorization headers are Fly secrets; only non-secret exporter metadata
  # is checked in here. Traces and aggregate metrics share the standard OTLP
  # HTTP/protobuf transport. Application logs remain available to a separately
  # owner-configured Fly log drain.
  ARIA_OBSERVABILITY_REQUIRED     = "true"
  OTEL_SERVICE_NAME               = "aria-msourcing"
  OTEL_EXPORTER_OTLP_PROTOCOL     = "http/protobuf"
  OTEL_TRACES_EXPORTER            = "otlp"
  OTEL_METRICS_EXPORTER           = "otlp"
  OTEL_LOGS_EXPORTER              = "none"
  OTEL_METRIC_EXPORT_INTERVAL     = "60000"
  # Fail closed until a shared or edge throttle covers every public origin and
  # the cross-machine proof in docs/operations/NEED_INGRESS.md has passed.
  ARIA_NEED_INGRESS_SHARED_THROTTLE_VERIFIED = "false"
  # Set only by the protected activation gate after it validates the signed,
  # exact-release shared-throttle receipt. A bare `true` is never authority.
  ARIA_NEED_INGRESS_SHARED_THROTTLE_EVIDENCE_SHA256 = ""
  # Secrets (fly secrets set): SUPABASE_SERVICE_ROLE_KEY (=FLY_SUPABASE_SERVICE_KEY),
  #   DATA_ENCRYPTION_KEY (=FLY_DATA_ENCRYPTION_KEY), CRON_SECRET (=FLY_CRON_SECRET),
  #   OTEL_EXPORTER_OTLP_ENDPOINT (=FLY_OTEL_EXPORTER_OTLP_ENDPOINT), and
  #   OTEL_EXPORTER_OTLP_HEADERS (=FLY_OTEL_EXPORTER_OTLP_HEADERS).
  # Do NOT set NEXT_PUBLIC_ENABLE_DEMO_LOGIN / DEMO_ADMIN_PASSWORD on a real tenant.

[http_service]
  processes            = ["web"]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines   = "suspend"
  auto_start_machines  = true
  min_machines_running = 1
  [http_service.concurrency]
    type       = "requests"
    soft_limit = 200
    hard_limit = 250
  [[http_service.checks]]
    method       = "GET"
    path         = "/api/health"     # unauthenticated, force-dynamic; returns {ok,status:'healthy'} 200
    interval     = "15s"
    timeout      = "5s"
    grace_period = "20s"
  # /api/ready is intentionally NOT a proxy-routing check. Fly requires every
  # configured http_service check to pass before routing any traffic, and
  # /api/ready's agentFrameworks component is unconditionally required in
  # production (src/app/api/ready/route.ts) yet the Flowise/Deerflow adapters
  # it probes are not deployed here (tracked separately — relay Track C,
  # "Flowise sidecar deployment... still absent"). Gating the WHOLE app's
  # reachability on an unrelated, not-yet-shipped subsystem would make every
  # feature unreachable for a reason unconnected to whether requests can
  # actually be served. /api/ready stays deployed, unmodified, and fully
  # honest for monitoring/ops — curl it directly for the real deep-readiness
  # verdict (db/auth/queue/migration-ledger/release-identity/agentFrameworks).

# Intended web baseline only. It is not a capacity or latency claim. Follow the
# measurement and one-variable-at-a-time procedure in docs/operations/FLY_SIZING.md
# before changing CPU class, Machine count, memory, or region placement.
[[vm]]
  processes = ["web"]
  size   = "shared-cpu-2x"
  memory = "2gb"

[[vm]]
  processes = ["cleanup"]
  size      = "shared-cpu-1x"
  memory    = "256mb"

[[vm]]
  processes = ["framework_heartbeat"]
  size      = "shared-cpu-1x"
  memory    = "256mb"

# Autonomous-loop tick worker (PLAN.md Rock 1). SHIPS DARK: the worker does
# NOTHING unless ARIA_LOOP_KILL_SWITCH is set to the exact string "false".
# The protected config pins it to "true" so a fresh deploy is provably inert.
# When live it reuses the cron dispatch route on the web process, so every
# send-side guardrail (approval re-verification, suppression, quiet hours,
# atomic claims) applies verbatim — just minute-level instead of daily.
[[vm]]
  processes = ["loop"]
  size      = "shared-cpu-1x"
  memory    = "256mb"
