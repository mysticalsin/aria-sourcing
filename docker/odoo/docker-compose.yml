# Local Odoo for developing the ARIA <-> Odoo integration (docs/odoo.md).
#
# A separate Compose project so it never touches the ARIA stack:
#   docker compose -f docker/odoo/docker-compose.yml up -d
#   bash docker/odoo/setup.sh              # Recruitment + demo data, API key file
#
# Odoo is then on http://localhost:8069 (login admin / admin). From the ARIA
# app container it is http://host.docker.internal:8069. Development only:
# fixed weak passwords, demo data, plain HTTP.

name: aria-odoo

services:
  odoo-db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    image: odoo:20.0
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo

volumes:
  odoo-db-data:
  odoo-data:
