<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AriaBot · LinkedIn outreach</title>
    <style>
      :root {
        --navy: #0a66c2;
        --ink: #1a1a1a;
        --muted: #666;
        --line: #e6e6e6;
        --bg: #f3f2ef;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      .top {
        background: #fff;
        border-bottom: 1px solid var(--line);
        padding: 10px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .badge {
        background: #0b1b33;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 4px 8px;
        border-radius: 999px;
      }
      .top strong { font-size: 14px; }
      .top span { color: var(--muted); font-size: 12px; }
      .wrap { max-width: 720px; margin: 24px auto; padding: 0 16px; }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(0,0,0,.04);
      }
      .profile {
        display: flex;
        gap: 14px;
        padding: 18px;
        border-bottom: 1px solid var(--line);
        align-items: center;
      }
      .avatar {
        width: 56px; height: 56px; border-radius: 999px;
        background: linear-gradient(135deg, #0a66c2, #004182);
        color: #fff; display: grid; place-items: center;
        font-weight: 700; font-size: 18px;
      }
      .profile h1 { margin: 0; font-size: 18px; }
      .profile p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
      .compose { padding: 18px; }
      .compose label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
      .compose textarea {
        width: 100%; min-height: 140px; resize: vertical;
        border: 1px solid var(--line); border-radius: 10px;
        padding: 12px; font: inherit; line-height: 1.45;
      }
      .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
      button {
        border: 0; border-radius: 999px; padding: 10px 18px;
        font-weight: 600; font-size: 14px; cursor: default;
      }
      .send { background: var(--navy); color: #fff; }
      .status {
        margin-top: 14px; padding: 10px 12px; border-radius: 8px;
        background: #e8f3ff; color: #004182; font-size: 13px; font-weight: 600;
      }
      .cursor {
        display: inline-block; width: 8px; height: 16px; background: var(--navy);
        margin-left: 2px; animation: blink 1s step-end infinite; vertical-align: text-bottom;
      }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </head>
  <body>
    <div class="top">
      <span class="badge">ARIABOT</span>
      <strong>LinkedIn outreach</strong>
      <span>Live Chromium seat · sourcing reach-out</span>
    </div>
    <div class="wrap">
      <div class="card">
        <div class="profile">
          <div class="avatar">ZM</div>
          <div>
            <h1 id="name">Zachary Maggard</h1>
            <p id="title">Senior Desktop Engineer · Paycor · Montreal</p>
          </div>
        </div>
        <div class="compose">
          <label>Message</label>
          <textarea id="body" readonly></textarea>
          <div class="actions">
            <button class="send" id="send">Send</button>
          </div>
          <div class="status" id="status">AriaBot is composing the LinkedIn message…</div>
        </div>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const name = params.get("name") || "Zachary Maggard";
      const title = params.get("title") || "Senior Desktop Engineer · Paycor · Montreal";
      const message =
        params.get("message") ||
        "Hi Zachary — we're hiring an Enterprise Windows Desktop Engineer for a Montreal hybrid role (Intune, Autopilot, PowerShell). Your desktop engineering background looks like a strong fit. Open to a short chat this week?";
      document.getElementById("name").textContent = name;
      document.getElementById("title").textContent = title;
      const body = document.getElementById("body");
      const status = document.getElementById("status");
      let i = 0;
      function typeNext() {
        if (i <= message.length) {
          body.value = message.slice(0, i);
          i += 1;
          setTimeout(typeNext, 18 + Math.random() * 28);
          return;
        }
        status.textContent = "AriaBot ready to send on LinkedIn · awaiting approval release";
        setTimeout(() => {
          status.textContent = "AriaBot sent LinkedIn message · waiting for reply";
          document.getElementById("send").textContent = "Sent";
          document.getElementById("send").style.opacity = "0.7";
        }, 1600);
      }
      typeNext();
    </script>
  </body>
</html>
