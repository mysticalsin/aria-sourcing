app = "aria-mantu-deerflow-adapter"
primary_region = "cdg"
kill_signal = "SIGTERM"
kill_timeout = 30

[deploy]
  strategy = "rolling"
  wait_timeout = "10m"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  BIND_HOST = "fly-local-6pn"
  ADAPTER_MODE = "deerflow"
  ADAPTER_TOKEN_FILE = "/run/secrets/deerflow_adapter_token"
  UPSTREAM_BASE_URL = "http://aria-mantu-deerflow.internal:8001"
  UPSTREAM_TOKEN_FILE = "/run/secrets/deerflow_internal_token"
  DEERFLOW_AGENT_ID = "aria-proposal"
  DEERFLOW_MODEL = "aria-model"
  AGENT_FRAMEWORK_CAPABILITY_SECRET_FILE = "/run/secrets/agent_framework_capability_secret"
  MODEL_GATEWAY_TOKEN_FILE = "/run/secrets/deerflow_model_gateway_token"
  REDIS_PASSWORD_FILE = "/run/secrets/deerflow_redis_password"
  REDIS_HOST = "aria-mantu-deerflow-redis.internal"
  REDIS_FLY_HOST = "aria-mantu-deerflow-redis.internal"
  REDIS_PORT = "6379"
  REDIS_DB = "0"
  DEERFLOW_POLICY_REFERENCE_DIR = "/opt/aria/policy/reference"
  DEERFLOW_POLICY_RUNTIME_DIR = "/opt/aria/policy/runtime"

[[files]]
  guest_path = "/run/secrets/deerflow_adapter_token"
  secret_name = "ARIA_ADAPTER_TOKEN_B64"
[[files]]
  guest_path = "/run/secrets/deerflow_internal_token"
  secret_name = "ARIA_UPSTREAM_TOKEN_B64"
[[files]]
  guest_path = "/run/secrets/agent_framework_capability_secret"
  secret_name = "ARIA_CAPABILITY_SECRET_B64"
[[files]]
  guest_path = "/run/secrets/deerflow_redis_password"
  secret_name = "ARIA_REDIS_PASSWORD_B64"
[[files]]
  guest_path = "/run/secrets/deerflow_model_gateway_token"
  secret_name = "ARIA_GATEWAY_TOKEN_B64"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  persist_rootfs = "never"

[[restart]]
  policy = "always"
