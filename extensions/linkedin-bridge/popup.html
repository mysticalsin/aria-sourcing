<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ARIA LinkedIn Bridge</title>
    <style>
      :root { color-scheme: light dark; --muted: #6b7280; --ok: #15803d; --warn: #b45309; --err: #b91c1c; }
      body { font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; width: 340px; margin: 0; padding: 14px 16px 16px; }
      h1 { font-size: 15px; margin: 0 0 2px; }
      .sub { color: var(--muted); margin: 0 0 12px; font-size: 12px; }
      label { display: block; font-weight: 600; margin: 10px 0 4px; }
      input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #9ca3af; border-radius: 6px; font: inherit; background: transparent; color: inherit; }
      .check { display: flex; gap: 6px; align-items: flex-start; font-weight: 400; margin-top: 10px; }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button { flex: 1; padding: 7px 10px; border-radius: 6px; border: 1px solid #9ca3af; background: transparent; color: inherit; font: inherit; cursor: pointer; }
      button.primary { background: #0a66c2; border-color: #0a66c2; color: #fff; }
      .status { margin-top: 14px; padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; }
      .status p { margin: 2px 0; }
      .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
      .muted { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>ARIA LinkedIn Bridge</h1>
    <p class="sub">Experimental. Runs in your own LinkedIn session; LinkedIn's terms forbid automation and may restrict your account.</p>

    <form id="settings">
      <label for="ariaUrl">ARIA address</label>
      <input id="ariaUrl" type="text" placeholder="http://localhost:3000" autocomplete="off" />
      <label for="token">Pairing code</label>
      <input id="token" type="password" placeholder="aria_lnb_…" autocomplete="off" />
      <label class="check"><input id="autoOpenTab" type="checkbox" /> Open a pinned LinkedIn tab when ARIA needs one</label>
      <div class="row"><button class="primary" type="submit">Save</button></div>
    </form>

    <div class="status" id="status" aria-live="polite">
      <p id="session"></p>
      <p id="state"></p>
      <p id="detail" class="muted"></p>
    </div>

    <div class="row">
      <button id="sync" type="button">Sync now</button>
      <button id="open" type="button">Open ARIA inbox</button>
    </div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
