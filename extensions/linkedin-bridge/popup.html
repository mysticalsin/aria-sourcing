<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ARIA LinkedIn Bridge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="hero">
      <img class="mark" src="icons/logo.png" alt="" width="44" height="32" />
      <div class="brand">
        <div class="wordmark">ARIA</div>
        <div class="product">LinkedIn Bridge</div>
      </div>
      <span id="live" class="live" hidden><span class="pulse"></span>Live</span>
    </header>

    <main>
      <section class="checks" aria-live="polite">
        <div class="check" id="check-linkedin">
          <span class="state" aria-hidden="true"></span>
          <div class="text">
            <div class="label">LinkedIn</div>
            <div class="value"></div>
          </div>
        </div>
        <div class="check" id="check-aria">
          <span class="state" aria-hidden="true"></span>
          <div class="text">
            <div class="label">ARIA</div>
            <div class="value"></div>
          </div>
        </div>
        <div class="check" id="check-sync">
          <span class="state" aria-hidden="true"></span>
          <div class="text">
            <div class="label">Sync</div>
            <div class="value"></div>
          </div>
        </div>
      </section>

      <section class="stats">
        <div class="stat">
          <div class="num" id="unread">–</div>
          <div class="caption">unread</div>
        </div>
        <div class="stat">
          <div class="num"><span id="sent">–</span><span class="of" id="cap"></span></div>
          <div class="meter" aria-hidden="true"><span id="meter"></span></div>
          <div class="caption">sent in 24 h</div>
        </div>
      </section>

      <p id="alert" class="alert" role="status" hidden></p>

      <div class="actions">
        <button id="open" class="primary" type="button">Open LinkedIn inbox in ARIA</button>
        <button id="sync" class="secondary" type="button"><span class="spinner" hidden></span><span class="sync-label">Sync now</span></button>
      </div>

      <details id="settings">
        <summary>Settings</summary>
        <form id="settings-form">
          <label for="ariaUrl">ARIA address</label>
          <input id="ariaUrl" type="text" placeholder="http://localhost:3000" autocomplete="off" spellcheck="false" />
          <label for="token">Pairing code</label>
          <input id="token" type="password" placeholder="aria_lnb_…" autocomplete="off" spellcheck="false" />
          <p class="hint">Not needed when you click <b>Connect</b> on the ARIA LinkedIn page: it pairs this browser in one click.</p>
          <label class="toggle"><input id="autoOpenTab" type="checkbox" /> Open a pinned LinkedIn tab when ARIA needs one</label>
          <button class="secondary" type="submit">Save</button>
        </form>
      </details>
    </main>

    <footer>
      Runs in your own LinkedIn session. LinkedIn's terms forbid automation and may restrict your account.
      <span class="version">v<span id="version"></span></span>
    </footer>
    <script src="popup.js" type="module"></script>
  </body>
</html>
