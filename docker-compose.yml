# =============================================================================
# Aria Sourcing — fully self-contained stack: the app + Supabase (db, auth, rest,
# kong) all in Docker. No host `supabase start`, no external identity provider.
#
#   Start:  docker compose up --build        (first run builds images + migrates/seeds)
#   Stop:   docker compose down              (keeps the database in the db_data volume)
#   Reset:  docker compose down -v           (wipes the database; next up re-seeds)
#
# Log in at http://localhost:3000 with the one-click "admin / admin" shortcut, or the
# email form: admin@hermes.local / admindemo123.
#
# The keys below are the PUBLIC supabase sample keys — fine for a local stack only.
# For any non-local use, regenerate JWT_SECRET + the anon/service JWTs and override them.
# =============================================================================
name: aria-sourcing

x-keys:
  jwt_secret: &jwt_secret "your-super-secret-jwt-token-with-at-least-32-characters-long"
  jwt_exp: &jwt_exp "3600"
  owner_current_password: &owner_current_password "local_owner_current_password_00000000000000000"
  owner_password: &owner_password "local_owner_database_password_000000000000000000"
  postgres_password: &postgres_password "local_postgres_database_password_000000000000000"
  auth_password: &auth_password "local_auth_database_password_0000000000000000000"
  rest_password: &rest_password "local_rest_database_password_0000000000000000000"
  auth_db_url: &auth_db_url "postgres://supabase_auth_admin:local_auth_database_password_0000000000000000000@db:5432/postgres"
  rest_db_url: &rest_db_url "postgres://authenticator:local_rest_database_password_0000000000000000000@db:5432/postgres"
  demo_admin_pw: &demo_admin_pw "admindemo123"
  anon_key: &anon_key "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE" # gitleaks:allow -- public Supabase local-demo JWT
  service_key: &service_key "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q" # gitleaks:allow -- public Supabase local-demo JWT

services:
  # ---- Postgres (Supabase image: roles, auth schema, auth.uid(), extensions) --------
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      # The pinned image needs one bootstrap password while its bundled
      # migrations run. db-init immediately splits every active role before
      # Auth or REST starts.
      POSTGRES_PASSWORD: *owner_current_password
      JWT_SECRET: *jwt_secret
      JWT_EXP: *jwt_exp
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-54322}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---- One-shot owner reconciliation BEFORE GoTrue and PostgREST start --------------
  db-init:
    image: supabase/postgres:17.6.1.136
    depends_on:
      db:
        condition: service_healthy
    environment:
      SUPABASE_ADMIN_CURRENT_PASSWORD: *owner_current_password
      SUPABASE_ADMIN_TARGET_PASSWORD: *owner_password
      POSTGRES_TARGET_PASSWORD: *postgres_password
      SUPABASE_AUTH_ADMIN_TARGET_PASSWORD: *auth_password
      AUTHENTICATOR_TARGET_PASSWORD: *rest_password
      JWT_SECRET: *jwt_secret
      JWT_EXP: *jwt_exp
    volumes:
      - ./docker/bootstrap/supabase-admin-reconciliation.sql:/opt/aria/supabase-admin-reconciliation.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'owner_password="";
         attempt=0;
         until [ -n "$$owner_password" ]; do
           if PGPASSWORD="$$SUPABASE_ADMIN_CURRENT_PASSWORD" psql -X -w -h db -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -qc "select 1" >/dev/null 2>&1; then owner_password="$$SUPABASE_ADMIN_CURRENT_PASSWORD";
           elif PGPASSWORD="$$SUPABASE_ADMIN_TARGET_PASSWORD" psql -X -w -h db -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -qc "select 1" >/dev/null 2>&1; then owner_password="$$SUPABASE_ADMIN_TARGET_PASSWORD";
           else attempt=$$((attempt + 1));
             if [ "$$attempt" -ge 60 ]; then echo "[db-init] No configured owner credential works; preserve the database volume and check its credentials." >&2; exit 1; fi;
             sleep 2; fi;
         done;
         PGPASSWORD="$$owner_password" psql -X -w -h db -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -q -f /opt/aria/supabase-admin-reconciliation.sql'
    restart: "no"

  # ---- GoTrue (email+password auth, JWT issuance) -----------------------------------
  auth:
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: "http://localhost:${KONG_PORT:-54321}"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: *auth_db_url
      GOTRUE_SITE_URL: "http://localhost:${APP_PORT:-3000}"
      GOTRUE_URI_ALLOW_LIST: "http://localhost:${APP_PORT:-3000}/**,http://127.0.0.1:${APP_PORT:-3000}/**"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: *jwt_exp
      GOTRUE_JWT_SECRET: *jwt_secret
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- PostgREST (RLS-enforced CRUD + RPC over /rest/v1) ----------------------------
  rest:
    image: postgrest/postgrest:v14.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: *rest_db_url
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: *jwt_secret
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: *jwt_secret
      PGRST_APP_SETTINGS_JWT_EXP: *jwt_exp
      # Health endpoints (/ready, /live) live on the admin server; without this
      # port the healthcheck errors forever while the API itself serves fine.
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_SERVER_HOST: "0.0.0.0"
    # The amd64 image has no shell. A concrete host enables its native probe.
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Kong (single API gateway; routes /auth/v1 + /rest/v1 like supabase-js wants) --
  kong:
    image: kong/kong:3.9.1
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KONG_PORT:-54321}:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: *anon_key
      SUPABASE_SERVICE_KEY: *service_key
      DASHBOARD_USERNAME: supabase
      DASHBOARD_PASSWORD: supabase
    volumes:
      - ./docker/kong.yml:/home/kong/temp.yml:ro,z
      - ./docker/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro,z
    entrypoint: ["/bin/sh", "/home/kong/kong-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- One-shot: apply every numbered app migration (after GoTrue) + seed/promote admin ------
  supabase-bootstrap:
    build:
      context: ./docker/bootstrap
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: postgres
      POSTGRES_TARGET_PASSWORD: *postgres_password
      SERVICE_ROLE_KEY: *service_key
      DEMO_ADMIN_PASSWORD: *demo_admin_pw
    volumes:
      - ./supabase/migrations:/migrations:ro
    restart: "no"

  # ---- Built application: no dev compiler, source mount, or dependency volume --------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_SUPABASE_URL: "http://localhost:${KONG_PORT:-54321}"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: *anon_key
        NEXT_PUBLIC_APP_URL: "http://localhost:${APP_PORT:-3000}"
        ARIA_RELEASE_SHA: "${ARIA_RELEASE_SHA:-}"
    depends_on:
      supabase-bootstrap:
        condition: service_completed_successfully
      kong:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      ARIA_LOCAL_DEMO: "true"
      NEXT_PUBLIC_APP_URL: "http://localhost:${APP_PORT:-3000}"
      # Server (in-container) reaches Supabase via Kong by service name; the browser
      # uses the host-mapped localhost URL. config.ts prefers SUPABASE_URL on the server.
      SUPABASE_URL: http://kong:8000
      NEXT_PUBLIC_SUPABASE_URL: "http://localhost:${KONG_PORT:-54321}"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: *anon_key
      SUPABASE_SERVICE_ROLE_KEY: *service_key
      NEXT_PUBLIC_ALLOWED_EMAIL_DOMAIN: ""
      DEMO_ADMIN_PASSWORD: *demo_admin_pw
      # Public /careers board reads jobs published by the seeded workspace
      # (fixed id set in docker/bootstrap/run.sh).
      CAREERS_WORKSPACE_ID: "00000000-0000-4000-8000-000000000001"
    volumes:
      - app_config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  db_data:
  app_config:
